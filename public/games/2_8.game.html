<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CODEPLAY — Score Counter Game! 🎮</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Share+Tech+Mono&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#e8f6f5;
  --surface:rgba(255,255,255,0.76);
  --surface2:rgba(255,255,255,0.93);
  --border:rgba(255,255,255,0.85);
  --border2:rgba(12,191,181,0.25);

  --cyan:#00b8aa;
  --teal:#0cbfb5;
  --teal-soft:#c5f0ec;
  --purple:#7c5cbf;
  --purple-soft:#e9e2f8;
  --pink:#d4567a;
  --pink-soft:#fce4ec;
  --gold:#c8960a;
  --gold-soft:#fff3cc;
  --green:#1a9e6a;
  --green-soft:#d1f5e8;
  --red:#d0394f;
  --red-soft:#fde8ec;
  --orange:#d4620a;
  --orange-soft:#fdecd6;
  --blue:#2563a8;

  --text:#1a2e35;
  --text2:#2d4a54;
  --muted:#6b8e96;
  --muted2:rgba(107,142,150,0.5);

  --mono:'Share Tech Mono',monospace;
  --body:'Plus Jakarta Sans','Nunito',sans-serif;

  --shadow-sm:0 1px 4px rgba(0,100,120,0.08),0 1px 2px rgba(0,100,120,0.05);
  --shadow-md:0 4px 18px rgba(0,100,120,0.1),0 2px 6px rgba(0,100,120,0.07);
  --shadow-lg:0 10px 36px rgba(0,100,120,0.13),0 4px 12px rgba(0,100,120,0.08);
  --glow-teal:0 0 18px rgba(12,191,181,0.28);
  --glow-purple:0 0 16px rgba(124,92,191,0.22);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column}

/* ── BACKGROUND ── */
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 8% 0%,rgba(100,225,230,0.3),transparent 58%),radial-gradient(ellipse 60% 70% at 92% 8%,rgba(150,195,245,0.22),transparent 55%),radial-gradient(ellipse 70% 50% at 50% 100%,rgba(180,155,240,0.18),transparent 58%),radial-gradient(ellipse 50% 55% at 80% 65%,rgba(90,230,210,0.15),transparent 55%),linear-gradient(155deg,#dff7f5 0%,#e8f0fb 38%,#f0e8f8 68%,#e0f5f2 100%);animation:meshShift 22s ease-in-out infinite alternate}
@keyframes meshShift{0%{filter:hue-rotate(0deg) brightness(1)}50%{filter:hue-rotate(7deg) brightness(1.02)}100%{filter:hue-rotate(-4deg) brightness(0.99)}}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(65px)}
.ob1{width:520px;height:520px;top:-160px;left:-110px;background:radial-gradient(circle,rgba(12,191,181,0.2),transparent 65%);animation:ob1 28s ease-in-out infinite alternate}
.ob2{width:420px;height:420px;bottom:-110px;right:-90px;background:radial-gradient(circle,rgba(124,92,191,0.16),transparent 65%);animation:ob2 23s ease-in-out infinite alternate-reverse}
.ob3{width:320px;height:320px;top:42%;left:58%;background:radial-gradient(circle,rgba(212,86,122,0.1),transparent 65%);animation:ob3 19s ease-in-out infinite alternate}
@keyframes ob1{to{transform:translate(28px,18px)scale(1.08)}}
@keyframes ob2{to{transform:translate(-22px,16px)scale(1.06)}}
@keyframes ob3{to{transform:translate(-18px,-12px)scale(1.1)}}
.sparkle-field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sp{position:absolute;border-radius:50%;animation:spFloat var(--dur,8s) ease-in-out infinite var(--delay,0s)}
@keyframes spFloat{0%,100%{transform:translateY(0) scale(1);opacity:var(--op,0.35)}50%{transform:translateY(-13px) scale(1.2);opacity:calc(var(--op,0.35)*1.7)}}

/* keyframes */
@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.8)}65%{transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
@keyframes bigBounce{0%,100%{transform:scale(1)}40%{transform:scale(1.22)}70%{transform:scale(.95)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes confettiFall{to{transform:translateY(110vh)rotate(720deg);opacity:0}}
@keyframes pulseTeal{0%,100%{box-shadow:0 0 0 0 rgba(12,191,181,0.5)}70%{box-shadow:0 0 0 12px rgba(12,191,181,0)}}
@keyframes shine{to{left:160%}}
@keyframes starPop{0%{transform:scale(0)rotate(-30deg);opacity:1}100%{transform:scale(2.6)rotate(15deg);opacity:0}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes scoreCount{0%{transform:scale(1)}30%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes rocketFly{0%,100%{transform:translateY(0)rotate(0)}50%{transform:translateY(-13px)rotate(-5deg)}}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:100;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:rgba(255,255,255,0.84);backdrop-filter:blur(20px);border-bottom:1px solid rgba(12,191,181,0.18);box-shadow:0 1px 14px rgba(0,100,120,0.07)}
.logo{font-weight:900;font-size:1.18rem;color:#ff8c00;letter-spacing:-.01em}
.nav-mid{font-size:.78rem;color:var(--muted);font-weight:700}
@media(max-width:480px){.nav-mid{display:none}}
.btn-back{display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:99px;border:1.5px solid rgba(12,191,181,0.3);background:rgba(12,191,181,0.07);color:var(--teal);font-size:.83rem;font-weight:800;cursor:pointer;transition:all .2s;font-family:var(--body)}
.btn-back:hover{background:rgba(12,191,181,0.16);box-shadow:var(--glow-teal)}
.btn-back svg{width:14px;height:14px;stroke:var(--teal);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ── SHELL ── */
.shell{position:relative;z-index:2;max-width:900px;width:100%;margin:0 auto;padding:14px 16px 80px}

/* ── HEADER ── */
.game-header{text-align:center;margin-bottom:12px;animation:fadeUp .5s ease both}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1.5px solid rgba(12,191,181,0.35);background:rgba(12,191,181,0.08);padding:5px 18px;border-radius:99px;font-size:.7rem;letter-spacing:.18em;color:var(--teal);text-transform:uppercase;margin-bottom:6px;font-weight:800}
.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 9px var(--teal);animation:blink 1.2s infinite}
.game-title{font-size:clamp(2rem,6vw,3rem);font-weight:900;color:var(--text);margin-bottom:10px;line-height:1.1;letter-spacing:-.02em}
.hl{background:linear-gradient(135deg,var(--teal) 0%,var(--purple) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.game-sub{font-size:.92rem;color:var(--muted);line-height:1.55;font-weight:600;max-width:540px;margin:0 auto}

/* ── SCOREBOARD ── */
.scoreboard{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.spill{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:99px;padding:6px 14px;font-size:.82rem;font-weight:800;color:var(--text2);box-shadow:var(--shadow-sm)}
.spill .v{font-family:var(--mono);font-size:.92rem}

/* ── STAGE BAR ── */
.stg-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.stg-lbl{font-size:.73rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.dots{display:flex;gap:8px}
.dot{width:24px;height:6px;border-radius:99px;background:rgba(12,191,181,0.14);transition:all .4s}
.dot.done{background:var(--green);box-shadow:0 0 7px rgba(26,158,106,0.5)}
.dot.active{background:var(--teal);box-shadow:0 0 10px rgba(12,191,181,0.7);animation:pulseTeal 1.5s infinite}

/* ── ARENA ── */
.arena{border-radius:18px;border:1.5px solid var(--border);background:var(--surface);backdrop-filter:blur(18px);padding:16px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:var(--shadow-md);animation:pop .4s ease both}
.arena::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:99px 99px 0 0;background:linear-gradient(90deg,transparent,var(--teal),var(--purple),transparent)}

/* ── STORY CARD ── */
.story-card{background:rgba(12,191,181,0.06);border:1.5px solid rgba(12,191,181,0.18);border-radius:14px;padding:10px 14px;margin-bottom:12px;text-align:center}
.mascot{font-size:2.1rem;display:block;margin-bottom:4px;animation:rocketFly 3s ease-in-out infinite}
.story-text{font-size:.9rem;font-weight:700;color:var(--text2);line-height:1.55}
.story-text b{color:var(--teal);font-weight:800}
.story-text .hi{color:var(--gold);font-weight:900}

/* DIFF BADGE */
.diff-badge{display:inline-flex;align-items:center;gap:5px;font-size:.6rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:2px 10px;border-radius:99px;margin-bottom:8px}
.diff-badge.easy{background:var(--green-soft);border:1px solid rgba(26,158,106,0.3);color:var(--green)}
.diff-badge.medium{background:var(--gold-soft);border:1px solid rgba(200,150,10,0.3);color:var(--gold)}
.diff-badge.hard{background:var(--purple-soft);border:1px solid rgba(124,92,191,0.3);color:var(--purple)}

/* HINT BOX */
.hint-box{background:rgba(200,150,10,0.06);border:1px solid rgba(200,150,10,0.2);border-radius:10px;padding:8px 13px;font-size:.82rem;color:var(--muted);font-weight:700;margin-bottom:12px;line-height:1.5}
.hint-box b{color:var(--gold);font-weight:800}

/* ── SCORE TRACKER ── */
.score-tracker{background:rgba(240,248,255,0.88);border:1.5px solid rgba(12,191,181,0.2);border-radius:14px;padding:12px;margin-bottom:12px;text-align:center;box-shadow:var(--shadow-sm)}
.sc-label{font-size:.58rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted2);margin-bottom:5px}
.sc-value{font-family:var(--mono);font-size:2.8rem;font-weight:900;color:var(--gold);line-height:1;display:block;transition:color .2s}
.sc-value.going-up{color:var(--green);animation:scoreCount .35s ease}
.sc-value.going-down{color:var(--red);animation:scoreCount .35s ease}
.sc-code{font-family:var(--mono);font-size:.8rem;color:var(--muted2);margin-top:10px;min-height:22px}
.sc-code .cv{color:var(--orange)}.sc-code .cn{color:var(--green)}.sc-code .co{color:var(--teal)}

.events-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.event-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;border:1px solid rgba(12,191,181,0.1);background:rgba(255,255,255,0.4);font-size:.82rem;font-weight:700;color:var(--muted);transition:all .3s}
.event-item.done{background:rgba(12,191,181,0.07);border-color:rgba(12,191,181,0.25);color:var(--text2)}
.event-item.done.up{background:var(--green-soft);border-color:rgba(26,158,106,0.28)}
.event-item.done.down{background:var(--red-soft);border-color:rgba(208,57,79,0.25)}
.event-item.active{background:rgba(12,191,181,0.1);border-color:rgba(12,191,181,0.45);color:var(--text);box-shadow:0 0 12px rgba(12,191,181,0.15)}
.ev-icon{font-size:1.1rem;flex-shrink:0}
.ev-text{flex:1}
.ev-delta{font-family:var(--mono);font-size:.8rem;font-weight:900;flex-shrink:0}
.ev-delta.up{color:var(--green)}.ev-delta.down{color:var(--red)}
.ev-done-mark{font-size:1rem;flex-shrink:0}

.next-event-btn{width:100%;padding:10px;border-radius:12px;border:1.5px solid rgba(12,191,181,0.3);background:rgba(12,191,181,0.07);color:var(--teal);font-size:.85rem;font-weight:800;cursor:pointer;transition:all .22s;font-family:var(--body);display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:10px}
.next-event-btn:hover{background:rgba(12,191,181,0.15);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.next-event-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

/* CHOICE GRID */
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{padding:0;border-radius:16px;border:1.5px solid rgba(12,191,181,0.2);background:rgba(255,255,255,0.7);font-family:var(--mono);font-size:1.4rem;color:var(--teal);font-weight:900;text-align:center;cursor:pointer;transition:all .22s;user-select:none;min-height:60px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.choice:hover,.choice:active{border-color:var(--teal);background:rgba(12,191,181,0.1);transform:translateY(-5px) scale(1.04);box-shadow:var(--shadow-md)}
.choice.ok{border-color:var(--green)!important;background:var(--green-soft)!important;color:var(--green)!important;box-shadow:0 0 22px rgba(26,158,106,0.28)!important;animation:bigBounce .45s ease;pointer-events:none}
.choice.bad{border-color:var(--red)!important;background:var(--red-soft)!important;color:var(--red)!important;animation:shake .45s ease;pointer-events:none}
.choice.reveal{border-color:rgba(26,158,106,0.55)!important;background:rgba(26,158,106,0.07)!important;color:var(--green)!important}
.choice.off{pointer-events:none;opacity:.4}

/* ── FILL THE BLANK ── */
.code-display{background:rgba(240,248,255,0.88);border:1.5px solid rgba(12,191,181,0.18);border-radius:14px;padding:13px 16px;margin-bottom:12px;font-family:var(--mono);font-size:.9rem;line-height:2.4;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.code-display::after{content:'🐍 python';position:absolute;top:9px;right:13px;font-size:.5rem;color:rgba(12,191,181,0.4);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.cl-var{color:var(--orange);font-weight:700}.cl-num{color:var(--green);font-weight:800}.cl-op{color:var(--teal);font-weight:900}.cl-eq{color:var(--muted2)}.cl-cm{color:var(--muted2);font-style:italic}
.blank{display:inline-block;min-width:58px;height:34px;border-radius:8px;border:2px dashed rgba(12,191,181,0.5);background:rgba(12,191,181,0.06);text-align:center;vertical-align:middle;line-height:28px;color:var(--teal);font-weight:900;font-size:.95rem;font-family:var(--mono);transition:all .25s;margin:0 5px}
.blank.filled{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.blank.ok{border-style:solid;border-color:var(--green);background:var(--green-soft);color:var(--green);box-shadow:0 0 14px rgba(26,158,106,0.3)}
.blank.bad{border-style:solid;border-color:var(--red);background:var(--red-soft);color:var(--red);animation:shake .4s ease}
.token-shelf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.token{padding:10px 18px;border-radius:12px;border:1.5px solid rgba(124,92,191,0.25);background:rgba(255,255,255,0.72);font-family:var(--mono);font-size:.92rem;color:var(--gold);font-weight:900;cursor:pointer;transition:all .22s;user-select:none;min-width:56px;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.token:hover,.token:active{background:var(--purple-soft);border-color:var(--purple);transform:translateY(-5px) scale(1.04);box-shadow:var(--shadow-md)}
.token.used{opacity:.18;pointer-events:none;text-decoration:line-through}
.token.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}

/* ── BUG ZAPPER ── */
.bug-terminal{background:rgba(255,240,242,0.9);border:1.5px solid rgba(208,57,79,0.3);border-radius:12px;padding:11px 15px;margin-bottom:10px;position:relative;overflow:hidden}
.bug-terminal::before{content:'⚠ BUG DETECTED';position:absolute;top:8px;right:12px;font-size:.5rem;color:rgba(208,57,79,.5);letter-spacing:.15em;font-weight:900}
.bug-code{font-family:var(--mono);font-size:.88rem;color:var(--red);font-weight:800;line-height:1.8}
.bug-error{font-size:.74rem;color:rgba(208,57,79,.55);margin-top:6px;font-family:var(--mono)}
.robot-bubble{display:flex;align-items:flex-start;gap:10px;background:rgba(12,191,181,0.06);border:1.5px solid rgba(12,191,181,0.18);border-radius:12px;padding:9px 13px;margin-bottom:10px}
.rb-robot{font-size:1.7rem;flex-shrink:0;animation:wiggle 3s ease-in-out infinite}
.rb-text{font-size:.82rem;font-weight:700;color:var(--text2);line-height:1.5}
.rb-text b{color:var(--teal);font-weight:800}
.fix-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fix-opt{padding:10px 8px;border-radius:12px;border:1.5px solid rgba(12,191,181,0.18);background:rgba(255,255,255,0.68);font-family:var(--mono);font-size:.8rem;color:var(--text2);cursor:pointer;transition:all .22s;font-weight:800;text-align:center;min-height:46px;display:flex;align-items:center;justify-content:center;line-height:1.4;box-shadow:var(--shadow-sm)}
.fix-opt:hover,.fix-opt:active{border-color:var(--teal);background:rgba(12,191,181,0.08);color:var(--teal);transform:translateY(-3px);box-shadow:var(--shadow-md)}
.fix-opt.ok{border-color:var(--green)!important;background:var(--green-soft)!important;color:var(--green)!important;box-shadow:0 0 16px rgba(26,158,106,0.25)!important;animation:bigBounce .4s ease;pointer-events:none}
.fix-opt.bad{border-color:var(--red)!important;background:var(--red-soft)!important;color:var(--red)!important;animation:shake .45s ease;pointer-events:none}
.fix-opt.reveal{border-color:rgba(26,158,106,0.5)!important;background:rgba(26,158,106,0.07)!important;color:var(--green)!important}
.fix-opt.off{pointer-events:none;opacity:.4}

/* ── WHAT DOES IT PRINT ── */
.code-block{background:rgba(240,248,255,0.88);border:1.5px solid rgba(12,191,181,0.18);border-radius:14px;padding:13px 16px;margin-bottom:10px;font-family:var(--mono);font-size:.88rem;line-height:2.3;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.code-block::after{content:'🐍 python';position:absolute;top:9px;right:13px;font-size:.5rem;color:rgba(12,191,181,0.38);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.print-q{display:flex;align-items:center;gap:8px;background:rgba(12,191,181,0.07);border:1.5px solid rgba(12,191,181,0.2);border-radius:10px;padding:9px 14px;margin-bottom:12px}
.pq-lbl{font-family:var(--mono);font-size:.82rem;color:var(--muted2);flex-shrink:0}
.pq-fn{font-family:var(--mono);font-size:.82rem;color:var(--teal);font-weight:900}
.pq-arr{color:var(--muted2);font-size:1.1rem}
.pq-blank{font-family:var(--mono);font-size:1.1rem;font-weight:900;color:var(--gold);animation:blink .9s ease-in-out infinite}

/* ── TOAST ── */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(22px);z-index:999;padding:13px 24px;border-radius:18px;font-weight:800;font-size:.92rem;opacity:0;transition:all .3s;pointer-events:none;backdrop-filter:blur(16px);max-width:88vw;text-align:center;font-family:var(--body)}
.toast.ok{background:rgba(242,255,250,0.97);border:1.5px solid rgba(26,158,106,0.35);color:var(--green);box-shadow:var(--shadow-md)}
.toast.bad{background:rgba(255,242,244,0.97);border:1.5px solid rgba(208,57,79,0.3);color:var(--red);box-shadow:var(--shadow-md)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── NEXT BTN ── */
.nextwrap{display:flex;justify-content:center;margin-top:8px;min-height:62px}
.bnext{padding:13px 36px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--teal),var(--purple));color:#fff;font-size:1.05rem;font-weight:900;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;display:none;align-items:center;gap:10px;letter-spacing:.03em;font-family:var(--body);box-shadow:0 5px 20px rgba(12,191,181,0.3)}
.bnext::after{content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 2s linear infinite}
.bnext:hover{transform:translateY(-4px);box-shadow:0 10px 34px rgba(12,191,181,0.44)}
.bnext.show{display:flex;animation:pop .4s ease}

/* ── RESULT ── */
.result{display:none;text-align:center;padding:36px 16px;animation:fadeUp .55s ease both}
.result.show{display:block}
.r-trophy{font-size:6rem;margin-bottom:12px;display:block;animation:float 3s ease-in-out infinite}
.r-title{font-size:2.1rem;font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,var(--teal),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.02em}
.r-sub{font-size:1rem;color:var(--muted);max-width:360px;margin:0 auto 26px;line-height:1.65;font-weight:600}
.r-stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.rpill{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:16px;padding:12px 18px;min-width:76px;box-shadow:var(--shadow-sm)}
.rpval{font-size:1.5rem;font-weight:900;font-family:var(--mono)}
.rplbl{font-size:.68rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.r-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn-replay{padding:14px 28px;border-radius:16px;border:1.5px solid rgba(124,92,191,0.3);background:var(--purple-soft);color:var(--purple);font-size:.95rem;font-weight:800;cursor:pointer;transition:all .25s;font-family:var(--body)}
.btn-replay:hover{background:rgba(124,92,191,0.2);transform:translateY(-3px);box-shadow:var(--glow-purple)}
.btn-next-l{padding:14px 28px;border-radius:16px;border:none;background:linear-gradient(135deg,var(--teal),var(--purple));color:#fff;font-size:.95rem;font-weight:900;cursor:pointer;font-family:var(--body);position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(12,191,181,0.3)}
.btn-next-l::after{content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 2s linear infinite}
.btn-next-l:hover{transform:translateY(-3px);box-shadow:0 8px 26px rgba(12,191,181,0.44)}

.star-pop{position:fixed;font-size:2rem;pointer-events:none;z-index:9999;animation:starPop .55s ease forwards}
.cp{position:fixed;pointer-events:none;z-index:400;border-radius:3px;animation:confettiFall 2.8s ease-in forwards}

/* ── STATS BAR ── */
.stats-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;height:52px;background:rgba(255,255,255,0.9);backdrop-filter:blur(18px);border-top:1px solid rgba(12,191,181,0.16);box-shadow:0 -1px 14px rgba(0,100,120,0.07);display:flex;align-items:center;justify-content:center;gap:32px}
.sb-item{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);font-weight:700}
.sb-val{font-family:var(--mono);font-size:.8rem;font-weight:900}

@media(max-width:500px){
  .choice-grid,.fix-grid{grid-template-columns:1fr}
  .choice{font-size:1.5rem;min-height:68px}
  .stats-bar{gap:14px}
  .token{padding:13px 16px;min-width:58px}
}
</style>
</head>
<body>

<div class="bg-mesh"></div>
<div class="orb ob1"></div>
<div class="orb ob2"></div>
<div class="orb ob3"></div>
<div class="sparkle-field" id="sparkles"></div>

<nav>
  <div class="logo">🚀 CODEPLAY</div>
  <div class="nav-mid">Part 2 · Lesson 08 — Score Counter Game</div>
  <button class="btn-back" onclick="location.href='2_8lesson.html'">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Back
  </button>

<div class="shell">
  <div class="game-header">
    <div class="eyebrow">🎮 Score Counter</div>

  </div>

  <div class="result" id="result">
    <span class="r-trophy" id="rTrophy">🏆</span>

      <div class="rpill"><span class="rpval" id="rXP" style="color:var(--gold)">0</span><span class="rplbl">XP Won</span></div>
      <div class="rpill"><span class="rpval" id="rRight" style="color:var(--green)">0</span><span class="rplbl">Correct</span></div>
      <div class="rpill"><span class="rpval" id="rStars" style="color:var(--teal)">⭐</span><span class="rplbl">Stars</span></div>
    </div>
    <div class="r-btns">
      <button class="btn-replay" onclick="restart()">🔄 Play Again</button>
      <button class="btn-next-l" onclick="location.href='quest2.html'">Next Lesson 🚀</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="stats-bar">
  <div class="sb-item">📍<span class="sb-val" style="color:var(--teal)">Part 2</span></div>
  <div class="sb-item">📖<span class="sb-val" style="color:var(--text)">Lesson 8</span></div>
  <div class="sb-item">⚡<span class="sb-val" style="color:var(--gold)" id="barXP">0 XP</span></div>
</div>

<script>
/* ── SPARKLES ── */
(function(){
  const field=document.getElementById('sparkles');
  const colors=['rgba(12,191,181,','rgba(124,92,191,','rgba(212,86,122,','rgba(200,150,10,','rgba(26,158,106,'];
  for(let i=0;i<28;i++){
    const el=document.createElement('div');el.className='sp';
    const c=colors[Math.floor(Math.random()*colors.length)];
    const op=(0.13+Math.random()*0.27).toFixed(2);
    const size=3+Math.random()*5;
    el.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;background:${c}${op});--dur:${6+Math.random()*9}s;--delay:${Math.random()*6}s;--op:${op};filter:blur(${Math.random()>.5?'1px':'0px'})`;
    field.appendChild(el);
  }
})();

/* ── STATE ── */
let xp=0,lives=3,streak=0,hits=0,stage=0;
const TOTAL=4;

/* ════════ DATA ════════ */
const S1=[
  {diff:'easy',mascot:'🤖',story:'Cosmo is playing <b>Space Collector</b>. Watch the score change — then pick the final score!',start:0,events:[{icon:'⭐',text:'Collected a star!',delta:+1},{icon:'⭐',text:'Collected a star!',delta:+1},{icon:'⭐',text:'Collected a star!',delta:+1}],choices:[3,2,4,1],msg:'3 stars collected → score went up 3 times by 1 ✅'},
  {diff:'easy',mascot:'🛸',story:'Cosmo\'s spaceship earns points. Every <b>coin = +5</b>, every <b>crash = −2</b>!',start:0,events:[{icon:'🪙',text:'Grabbed a coin!',delta:+5},{icon:'🪙',text:'Grabbed a coin!',delta:+5},{icon:'💥',text:'Oops — crashed!',delta:-2}],choices:[8,12,10,3],msg:'5 + 5 − 2 = 8. score = score + 5 twice, then score = score − 2 ✅'},
  {diff:'medium',mascot:'🎮',story:'Cosmo is in a quiz! <b>Right answer = +10</b>, <b>wrong answer = −5</b>.',start:0,events:[{icon:'✅',text:'Correct answer!',delta:+10},{icon:'✅',text:'Correct answer!',delta:+10},{icon:'❌',text:'Wrong answer!',delta:-5},{icon:'✅',text:'Correct answer!',delta:+10}],choices:[25,30,20,15],msg:'10 + 10 − 5 + 10 = 25 ✅  Each line runs top to bottom!'},
  {diff:'medium',mascot:'🌙',story:'Moon racing! <b>Lap = +3</b>, <b>shortcut bonus = +10</b>, <b>penalty = −4</b>.',start:0,events:[{icon:'🏎️',text:'Completed lap 1!',delta:+3},{icon:'🏎️',text:'Completed lap 2!',delta:+3},{icon:'⚡',text:'Shortcut bonus!',delta:+10},{icon:'⚠️',text:'Out-of-bounds!',delta:-4}],choices:[12,16,8,10],msg:'3 + 3 + 10 − 4 = 12 ✅'},
  {diff:'hard',mascot:'🪐',story:'Cosmo battles aliens! <b>Zap = +5</b>, <b>shield bonus = +20</b>, <b>hit = −8</b>.',start:0,events:[{icon:'⚡',text:'Zapped alien!',delta:+5},{icon:'⚡',text:'Zapped alien!',delta:+5},{icon:'🛡️',text:'Shield bonus!',delta:+20},{icon:'💥',text:'Got hit!',delta:-8},{icon:'⚡',text:'Zapped alien!',delta:+5}],choices:[27,30,22,35],msg:'5 + 5 + 20 − 8 + 5 = 27 ✅'},
];
const S2=[
  {diff:'easy',mascot:'🤖',story:'Cosmo starts a new game. The score always begins at zero!',pre:'<span class="cl-var">score</span> <span class="cl-eq">=</span> ',post:'',hint:'Every game score <b>starts at zero</b>.',answer:'0',tokens:['0','1','10','score'],msg:'score = 0 — always start your score at zero! ✅'},
  {diff:'easy',mascot:'🛸',story:'Cosmo got a point! He wants to add 1 to his score.',pre:'<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-num">0</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> ',post:' <span class="cl-num">1</span>',hint:'Adding 1 means we use the <b>+</b> operator.',answer:'+',tokens:['+','-','*','/','='],msg:'score = score + 1 adds 1 to the current score! ✅'},
  {diff:'easy',mascot:'🌙',story:'Cosmo lost a life. He wants to take 1 away from his score.',pre:'<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-num">10</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> ',post:' <span class="cl-num">1</span>  <span class="cl-cm"># lose a point</span>',hint:'Taking away means we <b>subtract</b>.',answer:'-',tokens:['+','-','*','/'],msg:'score = score − 1 takes 1 away from the current score! ✅'},
  {diff:'medium',mascot:'⭐',story:'Cosmo hits a bonus star worth 10 points!',pre:'<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-num">5</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> <span class="cl-op">+</span> ',post:'  <span class="cl-cm"># bonus!</span>',hint:'The bonus is worth <b>10 points</b>.',answer:'10',tokens:['10','1','5','100'],msg:'score = score + 10 adds a 10-point bonus! ✅'},
  {diff:'medium',mascot:'🚀',story:'The game is over. Cosmo resets the score back to the start.',pre:'<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-num">42</span>\n<span class="cl-cm"># game over — reset!</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> ',post:'',hint:'Resetting always means going back to <b>zero</b>.',answer:'0',tokens:['0','1','42','score'],msg:'score = 0 resets the variable back to zero! ✅'},
  {diff:'hard',mascot:'🪐',story:'Cosmo wants to double his score as a special reward!',pre:'<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-num">6</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> ',post:' <span class="cl-num">2</span>  <span class="cl-cm"># double it!</span>',hint:'Doubling means multiplying by 2. Python uses <b>*</b>.',answer:'*',tokens:['+','-','*','/'],msg:'score = score * 2 doubles the score from 6 to 12! ✅'},
];
const S3=[
  {diff:'easy',mascot:'🤖',robot:'😬',robotName:'Cosmo',trouble:'I tried to add 1 to my score but Python says <b>NameError</b>! What\'s wrong?',broken:'score = Score + 1',wanted:'score goes from 5 to 6',choices:['score = score + 1','Score = score + 1','score = SCORE + 1','score = score + 1.0'],answer:0,msg:'Python is case-sensitive! score and Score are different. Always use lowercase ✅'},
  {diff:'easy',mascot:'🛸',robot:'🤖',robotName:'Beep',trouble:'My score never changes! It always stays at 1 no matter what.',broken:'score = 1',wanted:'score increases each time',choices:['score = score + 1','score == score + 1','score = score = 1','score + 1'],answer:0,msg:'score = 1 just sets score to 1 every time. score = score + 1 adds to it! ✅'},
  {diff:'medium',mascot:'🌙',robot:'👾',robotName:'Zorp',trouble:'I wanted to subtract 3 from my score but it ADDED 3 instead!',broken:'score = score + 3  # should lose 3',wanted:'score goes down by 3',choices:['score = score - 3','score = score + -3','score = -3','score = 3 - score'],answer:0,msg:'score = score − 3 subtracts 3. The + was the bug — it added instead of subtracting! ✅'},
  {diff:'medium',mascot:'⭐',robot:'🛸',robotName:'Nova',trouble:'Python crashed with a NameError before the game even started!',broken:'score = score + 1  # first line of game',wanted:'score starts at 0 then increases',choices:['score = 0\nscore = score + 1','score == 0\nscore = score + 1','score + 1','Score = 0\nscore = score + 1'],answer:0,msg:'You must set score = 0 first before you can use score on the right side! ✅'},
  {diff:'hard',mascot:'🪐',robot:'👽',robotName:'Alien',trouble:'I used score++ like in other coding games — but Python hates it!',broken:'score++',wanted:'score goes up by 1',choices:['score = score + 1','score =+ 1','score += + 1','score = 1 + 1'],answer:0,msg:'Python doesn\'t have ++. The correct way is score = score + 1 ✅'},
];
const S4=[
  {diff:'easy',mascot:'🤖',code:'<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-num">0</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> <span class="cl-op">+</span> <span class="cl-num">1</span>',fn:'score',answer:'1',choices:['1','0','2','01'],msg:'score starts at 0, then + 1 makes it 1 ✅'},
  {diff:'easy',mascot:'🌙',code:'<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-num">5</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> <span class="cl-op">-</span> <span class="cl-num">2</span>',fn:'score',answer:'3',choices:['3','7','5','2'],msg:'score starts at 5, then − 2 makes it 3 ✅'},
  {diff:'medium',mascot:'⭐',code:'<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-num">0</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> <span class="cl-op">+</span> <span class="cl-num">10</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> <span class="cl-op">+</span> <span class="cl-num">5</span>',fn:'score',answer:'15',choices:['15','10','5','105'],msg:'0 → +10 = 10 → +5 = 15 ✅  Python runs top to bottom!'},
  {diff:'medium',mascot:'🚀',code:'<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-num">20</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> <span class="cl-op">+</span> <span class="cl-num">10</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> <span class="cl-op">-</span> <span class="cl-num">5</span>',fn:'score',answer:'25',choices:['25','30','15','35'],msg:'20 → +10 = 30 → −5 = 25 ✅'},
  {diff:'medium',mascot:'🛸',code:'<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-num">0</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> <span class="cl-op">+</span> <span class="cl-num">1</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> <span class="cl-op">+</span> <span class="cl-num">1</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> <span class="cl-op">+</span> <span class="cl-num">1</span>',fn:'score',answer:'3',choices:['3','1','0','111'],msg:'Each + 1 adds one more. 0 → 1 → 2 → 3 ✅'},
  {diff:'hard',mascot:'🪐',code:'<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-num">10</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> <span class="cl-op">+</span> <span class="cl-num">5</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-num">0</span>\n<span class="cl-var">score</span> <span class="cl-eq">=</span> <span class="cl-var">score</span> <span class="cl-op">+</span> <span class="cl-num">3</span>',fn:'score',answer:'3',choices:['3','18','15','0'],msg:'10 + 5 = 15, then score = 0 resets it, then + 3 = 3 ✅  Reset wipes everything!'},
];

/* ── HELPERS ── */
function sync(){
  document.getElementById('elXP').textContent=xp;
  document.getElementById('elLives').textContent=lives>0?'❤️'.repeat(lives):'😴 Out!';
  document.getElementById('elStage').textContent=(stage+1)+'/'+TOTAL;
  document.getElementById('elStreak').textContent=streak;
  document.getElementById('barXP').textContent=xp+' XP';
}
let toastT;
function toast(type,msg){const t=document.getElementById('toast');t.textContent=msg.length>80?msg.slice(0,78)+'…':msg;t.className=`toast ${type} show`;clearTimeout(toastT);toastT=setTimeout(()=>t.className=`toast ${type}`,2700)}
function showNext(){document.getElementById('btnNext').classList.add('show')}
function hideNext(){document.getElementById('btnNext').classList.remove('show')}
function popStars(n=5){const e=['⭐','✨','🏆','🎮','💫','🎉','🚀'];for(let i=0;i<n;i++){const el=document.createElement('div');el.className='star-pop';el.textContent=e[i%e.length];el.style.cssText=`left:${10+Math.random()*80}vw;top:${15+Math.random()*55}vh;animation-delay:${i*.07}s;position:fixed;z-index:9999;font-size:${1.3+Math.random()*.8}rem;pointer-events:none`;document.body.appendChild(el);setTimeout(()=>el.remove(),750)}}
function confetti(){const cols=['#0cbfb5','#7c5cbf','#d4567a','#c8960a','#1a9e6a','#60a5fa'];for(let i=0;i<60;i++){const el=document.createElement('div');el.className='cp';el.style.cssText=`width:${5+Math.random()*7}px;height:${5+Math.random()*7}px;border-radius:${Math.random()>.5?'50%':'2px'};background:${cols[Math.floor(Math.random()*cols.length)]};left:${Math.random()*100}vw;top:-14px;animation-duration:${1.8+Math.random()*1.4}s;animation-delay:${Math.random()*.8}s`;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}}
function shuffleArr(a){return [...a].sort(()=>Math.random()-.5)}
const SNAMES=['🎯 Stage 1: Track the Score','✏️ Stage 2: Fill the Blank','🐛 Stage 3: Zap the Bug','🖨️ Stage 4: What Does it Print?'];
function stageBar(){return`<div class="stg-row"><span class="stg-lbl">${SNAMES[stage]}</span><div class="dots">${Array.from({length:TOTAL},(_,i)=>`<div class="dot${i<stage?' done':i===stage?' active':''}"></div>`).join('')}</div></div>`}
function diffBadge(d){return`<div class="diff-badge ${d}">${d==='easy'?'⭐ Easy':d==='medium'?'⭐⭐ Medium':'⭐⭐⭐ Tricky'}</div>`}

/* ── STAGE 1 ── */
let s1i=0,s1pool=[],s1eventIdx=0,s1currentScore=0,s1answered=false;
function initS1(){const easy=S1.filter(q=>q.diff==='easy'),med=S1.filter(q=>q.diff==='medium'),hard=S1.filter(q=>q.diff==='hard');s1pool=[...shuffleArr(easy),...shuffleArr(med),...shuffleArr(hard)].slice(0,4)}
function renderS1(){
  if(s1i>=s1pool.length){stageOver();return}
  hideNext();s1eventIdx=0;s1answered=false;const q=s1pool[s1i];s1currentScore=q.start;
  const evHTML=q.events.map((ev,i)=>`<div class="event-item" id="ev${i}"><span class="ev-icon">${ev.icon}</span><span class="ev-text">${ev.text}</span><span class="ev-delta ${ev.delta>0?'up':'down'}">${ev.delta>0?'+':''}${ev.delta}</span><span class="ev-done-mark" id="evmark${i}"></span></div>`).join('');
  document.getElementById('panel').innerHTML=`${stageBar()}<div class="arena"><div style="text-align:center;margin-bottom:10px">${diffBadge(q.diff)}</div><div class="story-card"><span class="mascot">${q.mascot}</span><div class="story-text">${q.story}</div></div><div class="score-tracker"><div class="sc-label">score</div><span class="sc-value" id="scVal">0</span><div class="sc-code" id="scCode"><span class="cv">score</span> <span class="co">=</span> <span class="cn">0</span></div></div><div class="events-list">${evHTML}</div><button class="next-event-btn" id="nextEvBtn" onclick="nextEvent()">▶ Next Event!</button><div id="choicesArea"></div></div>`;
  sync();
}
function nextEvent(){
  const q=s1pool[s1i];if(s1eventIdx>=q.events.length)return;
  const ev=q.events[s1eventIdx];s1currentScore+=ev.delta;
  const scEl=document.getElementById('scVal');scEl.className=`sc-value ${ev.delta>0?'going-up':'going-down'}`;scEl.textContent=s1currentScore;setTimeout(()=>{scEl.className='sc-value'},400);
  const op=ev.delta>0?'+':'-';const abs=Math.abs(ev.delta);
  document.getElementById('scCode').innerHTML=`<span class="cv">score</span> <span class="co">=</span> <span class="cv">score</span> <span class="co">${op}</span> <span class="cn">${abs}</span>  <span style="color:var(--muted2)">→ ${s1currentScore}</span>`;
  const evEl=document.getElementById('ev'+s1eventIdx);evEl.classList.add('done',ev.delta>0?'up':'down');document.getElementById('evmark'+s1eventIdx).textContent='✓';
  s1eventIdx++;
  if(s1eventIdx>=q.events.length){document.getElementById('nextEvBtn').disabled=true;document.getElementById('nextEvBtn').textContent='All done! Pick the final score 👇';setTimeout(()=>showS1Choices(q),600)}
}
function showS1Choices(q){
  const shuffled=shuffleArr([...q.choices]);
  document.getElementById('choicesArea').innerHTML=`<div class="hint-box">🏆 What is the <b>final score</b>?</div><div class="choice-grid" id="s1grid"></div>`;
  const grid=document.getElementById('s1grid');
  shuffled.forEach(c=>{const btn=document.createElement('div');btn.className='choice';btn.textContent=c;btn.addEventListener('click',()=>ansS1(c,btn,shuffled));grid.appendChild(btn)});
}
function ansS1(val,btn,shuffled){
  if(s1answered)return;s1answered=true;const q=s1pool[s1i];
  const btns=[...document.querySelectorAll('.choice')];btns.forEach(b=>b.classList.add('off'));
  const correct=q.start+q.events.reduce((a,e)=>a+e.delta,0);
  if(val===correct){btn.classList.remove('off');btn.classList.add('ok');xp+=q.diff==='easy'?15:q.diff==='medium'?20:25;streak++;hits++;popStars(6);toast('ok','🏆 '+q.msg);setTimeout(()=>{s1i++;renderS1()},1100)}
  else{btn.classList.remove('off');btn.classList.add('bad');btns.forEach((b,i)=>{if(shuffled[i]===correct){b.classList.remove('off');b.classList.add('reveal')}});lives=Math.max(0,lives-1);streak=0;toast('bad',`The final score was ${correct}. ${q.msg}`);setTimeout(()=>{s1i++;renderS1()},1500)}
  sync();
}

/* ── STAGE 2 ── */
let s2i=0,s2pool=[],s2done=false;
function initS2(){const easy=S2.filter(q=>q.diff==='easy'),med=S2.filter(q=>q.diff==='medium'),hard=S2.filter(q=>q.diff==='hard');s2pool=[...shuffleArr(easy),...shuffleArr(med),...shuffleArr(hard)].slice(0,5)}
function renderS2(){
  if(s2i>=s2pool.length){stageOver();return}
  hideNext();s2done=false;const q=s2pool[s2i];const shuffledToks=shuffleArr([...q.tokens]);
  document.getElementById('panel').innerHTML=`${stageBar()}<div class="arena"><div style="text-align:center;margin-bottom:10px">${diffBadge(q.diff)}</div><div class="story-card"><span class="mascot">${q.mascot}</span><div class="story-text">${q.story}</div></div><div class="code-display">${q.pre.replace(/\n/g,'<br>')}<span class="blank" id="theBlank">___</span>${q.post.replace(/\n/g,'<br>')}</div><div class="hint-box">💡 ${q.hint}</div><div class="token-shelf" id="s2shelf"></div></div>`;
  const shelf=document.getElementById('s2shelf');shuffledToks.forEach(tok=>{const btn=document.createElement('div');btn.className='token';btn.textContent=tok;btn.addEventListener('click',()=>ansS2(tok,btn,shuffledToks));shelf.appendChild(btn)});
  sync();
}
function ansS2(tok,btn,shuffledToks){
  if(s2done)return;s2done=true;const q=s2pool[s2i];const blank=document.getElementById('theBlank');blank.textContent=tok;blank.classList.add('filled');document.querySelectorAll('.token').forEach(b=>b.classList.add('used'));
  if(tok===q.answer){blank.classList.remove('filled');blank.classList.add('ok');xp+=q.diff==='easy'?18:q.diff==='medium'?22:26;streak++;hits++;popStars(7);toast('ok','✅ '+q.msg);setTimeout(()=>{s2i++;renderS2()},1100)}
  else{blank.classList.remove('filled');blank.classList.add('bad');document.querySelectorAll('.token').forEach((b,i)=>{if(shuffledToks[i]===q.answer){b.classList.remove('used');b.classList.add('ok')}});lives=Math.max(0,lives-1);streak=0;toast('bad',`Answer is "${q.answer}". ${q.msg}`);setTimeout(()=>{s2i++;renderS2()},1500)}
  sync();
}

/* ── STAGE 3 ── */
let s3i=0,s3pool=[];
function initS3(){const easy=S3.filter(q=>q.diff==='easy'),med=S3.filter(q=>q.diff==='medium'),hard=S3.filter(q=>q.diff==='hard');s3pool=[...shuffleArr(easy),...shuffleArr(med),...shuffleArr(hard)].slice(0,4)}
function renderS3(){
  if(s3i>=s3pool.length){stageOver();return}
  hideNext();const q=s3pool[s3i];const shuffled=shuffleArr(q.choices.map((c,oi)=>({c,oi})));
  document.getElementById('panel').innerHTML=`${stageBar()}<div class="arena"><div style="text-align:center;margin-bottom:10px">${diffBadge(q.diff)}</div><div class="bug-terminal"><div class="bug-code">${q.broken.replace(/\n/g,'<br>')}</div><div class="bug-error">⚠ This code has a bug — it won't work properly!</div></div><div class="robot-bubble"><span class="rb-robot">${q.robot}</span><div class="rb-text">I'm <b>${q.robotName}</b> — I wanted: <b style="color:var(--green)">${q.wanted}</b><br>${q.trouble}</div></div><div class="hint-box">🐛 <b>Zap the bug!</b> Pick the correct fixed code.</div><div class="fix-grid" id="s3grid"></div></div>`;
  const grid=document.getElementById('s3grid');shuffled.forEach(({c,oi},si)=>{const btn=document.createElement('div');btn.className='fix-opt';btn.innerHTML=c.replace(/\n/g,'<br>');btn.addEventListener('click',()=>ansS3(oi,si,shuffled));grid.appendChild(btn)});
  sync();
}
function ansS3(origIdx,slotIdx,shuffled){
  const q=s3pool[s3i];const btns=[...document.querySelectorAll('.fix-opt')];btns.forEach(b=>b.classList.add('off'));
  if(origIdx===q.answer){btns[slotIdx].classList.remove('off');btns[slotIdx].classList.add('ok');xp+=q.diff==='easy'?18:q.diff==='medium'?22:26;streak++;hits++;popStars(6);toast('ok','🐛 Bug zapped! '+q.msg);setTimeout(()=>{s3i++;renderS3()},1000)}
  else{btns[slotIdx].classList.remove('off');btns[slotIdx].classList.add('bad');shuffled.forEach(({oi},si)=>{if(oi===q.answer){btns[si].classList.remove('off');btns[si].classList.add('reveal')}});lives=Math.max(0,lives-1);streak=0;toast('bad',`Not quite! ${q.msg}`);setTimeout(()=>{s3i++;renderS3()},1500)}
  sync();
}

/* ── STAGE 4 ── */
let s4i=0,s4pool=[];
function initS4(){const easy=S4.filter(q=>q.diff==='easy'),med=S4.filter(q=>q.diff==='medium'),hard=S4.filter(q=>q.diff==='hard');s4pool=[...shuffleArr(easy),...shuffleArr(med),...shuffleArr(hard)].slice(0,5)}
function renderS4(){
  if(s4i>=s4pool.length){stageOver();return}
  hideNext();const q=s4pool[s4i];const shuffled=shuffleArr([...q.choices]);
  document.getElementById('panel').innerHTML=`${stageBar()}<div class="arena"><div style="text-align:center;margin-bottom:10px">${diffBadge(q.diff)}</div><div class="story-card" style="padding:12px 16px;margin-bottom:14px"><span class="mascot" style="font-size:2.1rem">${q.mascot}</span><div class="story-text">What does <b style="color:var(--teal)">print(${q.fn})</b> output after running this code?</div></div><div class="code-block">${q.code.replace(/\n/g,'<br>')}</div><div class="print-q"><span class="pq-lbl">print(</span><span class="pq-fn">${q.fn}</span><span class="pq-lbl">)</span><span class="pq-arr">→</span><span class="pq-blank">❓</span></div><div class="hint-box">💡 Trace through it <b>line by line, top to bottom!</b></div><div class="choice-grid" id="s4grid"></div></div>`;
  const grid=document.getElementById('s4grid');shuffled.forEach(c=>{const btn=document.createElement('div');btn.className='choice';btn.textContent=c;btn.addEventListener('click',()=>ansS4(c,btn,shuffled));grid.appendChild(btn)});
  sync();
}
function ansS4(val,btn,shuffled){
  const q=s4pool[s4i];const btns=[...document.querySelectorAll('.choice')];btns.forEach(b=>b.classList.add('off'));
  if(val===q.answer){btn.classList.remove('off');btn.classList.add('ok');xp+=q.diff==='easy'?18:q.diff==='medium'?22:26;streak++;hits++;popStars(7);toast('ok','🎉 '+q.msg);setTimeout(()=>{s4i++;renderS4()},1100)}
  else{btn.classList.remove('off');btn.classList.add('bad');btns.forEach((b,i)=>{if(shuffled[i]===q.answer){b.classList.remove('off');b.classList.add('reveal')}});lives=Math.max(0,lives-1);streak=0;toast('bad',`Answer is ${q.answer}. ${q.msg}`);setTimeout(()=>{s4i++;renderS4()},1500)}
  sync();
}

/* ── FLOW ── */
function stageOver(){showNext()}
function advance(){hideNext();stage++;if(stage>=TOTAL){showResult();return}render()}
function render(){
  document.getElementById('result').classList.remove('show');
  if(stage===0){initS1();renderS1()}else if(stage===1){initS2();renderS2()}else if(stage===2){initS3();renderS3()}else{initS4();renderS4()}
}
function showResult(){
  document.getElementById('panel').innerHTML='';hideNext();const el=document.getElementById('result');el.classList.add('show');
  const tier=xp>=310?0:xp>=180?1:2;
  const data=[{t:'🏆',ti:'Score Counter Master!',s:'Amazing! Cosmo\'s scoreboard is perfect. You understand score counters completely!'},{t:'🥈',ti:'Level Up! 🌟',s:'Great work! Cosmo\'s games are running. Keep practising to become a master!'},{t:'🥉',ti:'Trainee Programmer! 💪',s:'Good try! Review the lesson and have another go. You can do it!'}][tier];
  document.getElementById('rTrophy').textContent=data.t;document.getElementById('rTitle').textContent=data.ti;document.getElementById('rSub').textContent=data.s;
  document.getElementById('rXP').textContent=xp;document.getElementById('rRight').textContent=hits;document.getElementById('rStars').textContent=xp>=310?'⭐⭐⭐':xp>=180?'⭐⭐':'⭐';
  if(xp>=180)confetti();
  localStorage.setItem('p2_lesson08GameScore',xp);const prev=parseInt(localStorage.getItem('part2_progress'))||1;if(prev<9)localStorage.setItem('part2_progress','9');
}
function restart(){
  xp=0;lives=3;streak=0;hits=0;stage=0;s1i=0;s2i=0;s3i=0;s4i=0;
  document.getElementById('result').classList.remove('show');render();
}
render();
</script>
