<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CODEPLAY — Lesson 05 Game: Robot Talks!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&family=Fredoka+One&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:         #e8f5e2;
  --surface:    #ffffff;
  --surface2:   #f4faf0;
  --border:     rgba(80,140,60,.18);
  --green-dark: #1e5c1e;
  --green-mid:  #2e7d32;
  --green-leaf: #4caf50;
  --green-light:#a5d6a7;
  --gold:       #f5c800;
  --gold-soft:  #ffe066;
  --orange:     #ff8c00;
  --orange-soft:#ffb74d;
  --correct:    #27c76f;
  --wrong:      #e84040;
  --text:       #1a3d1a;
  --text-mid:   #2e5c2e;
  --text-muted: #6a9a6a;
  --mono:       'Share Tech Mono', monospace;
  --head:       'Fredoka One', cursive;
  --body:       'Nunito', sans-serif;
  --shadow-card:0 4px 24px rgba(46,125,50,.10), 0 1px 4px rgba(46,125,50,.06);
  --shadow-strong:0 8px 40px rgba(46,125,50,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column}

/* ── Forest background ── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 700px 500px at 10% 15%, rgba(180,230,160,.45) 0%, transparent 70%),
    radial-gradient(ellipse 500px 400px at 90% 80%, rgba(200,235,170,.4) 0%, transparent 65%),
    radial-gradient(ellipse 400px 300px at 55% 50%, rgba(255,255,220,.3) 0%, transparent 60%);
  pointer-events:none;
}
.leaf-deco{position:fixed;pointer-events:none;z-index:0;opacity:.09;user-select:none;animation:leafFloat 8s ease-in-out infinite alternate}
.leaf-deco:nth-child(1){top:6%;left:2%;font-size:3rem;animation-delay:0s}
.leaf-deco:nth-child(2){top:22%;right:3%;font-size:2.5rem;animation-delay:1.5s}
.leaf-deco:nth-child(3){bottom:22%;left:5%;font-size:3.5rem;animation-delay:3s}
.leaf-deco:nth-child(4){bottom:38%;right:2%;font-size:2rem;animation-delay:2s}
.leaf-deco:nth-child(5){top:55%;left:47%;font-size:2.8rem;animation-delay:4s}

@keyframes leafFloat{0%{transform:translateY(0) rotate(-5deg)}100%{transform:translateY(-18px) rotate(8deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes shine{to{left:160%}}
@keyframes pop{0%{transform:scale(.5);opacity:0}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.3) rotate(5deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes robotFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes starBurst{0%{opacity:0;transform:scale(0) rotate(-40deg)}65%{opacity:1;transform:scale(1.3) rotate(12deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes confettiFall{from{transform:translateY(-20px) rotate(0deg);opacity:1}to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes unlockPulse{0%,100%{box-shadow:0 0 0 0 rgba(39,199,111,.4)}50%{box-shadow:0 0 0 10px rgba(39,199,111,0)}}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(76,175,80,.25)}50%{box-shadow:0 0 0 8px rgba(76,175,80,.0)}}
@keyframes gradShift{0%{background-position:0%}100%{background-position:200%}}

/* ── NAV ── */
nav{
  position:sticky;top:0;z-index:100;
  height:64px;display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(200,200,200,.2);
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--head);font-size:1.4rem;color:#ff8c00;letter-spacing:.04em;text-shadow:0 2px 8px rgba(255,140,0,.3)}
.logo-leaf{font-size:1.5rem;animation:leafFloat 4s ease-in-out infinite alternate}
.nav-center{display:flex;align-items:center;gap:10px}
.nav-pip{width:6px;height:6px;border-radius:50%;background:var(--gold-soft);box-shadow:0 0 10px var(--gold);animation:blink 1.4s infinite}
.nav-lesson-tag{font-size:.6rem;letter-spacing:.18em;color:rgba(0,0,0,.55);text-transform:uppercase}
.nav-lesson-title{font-size:.78rem;font-weight:800;color:#1a3d1a}
.nav-right{display:flex;align-items:center;gap:14px}
.stars-pill{
  display:flex;align-items:center;gap:6px;
  background:rgba(245,200,0,.15);border:1.5px solid rgba(245,200,0,.4);
  padding:7px 18px;border-radius:99px;
  font-family:var(--head);font-size:.75rem;color:var(--gold-soft);letter-spacing:.06em;
}
.btn-back{
  display:flex;align-items:center;gap:7px;padding:8px 18px;border-radius:99px;
  border:1.5px solid rgba(165,214,167,.4);background:rgba(255,255,255,.08);color:#1a3d1a;
  font-family:var(--body);font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s;
}
.btn-back:hover{border-color:rgba(165,214,167,.7);background:rgba(255,255,255,.15);transform:translateX(-2px)}
.btn-back svg{width:13px;height:13px;stroke:#1a3d1a;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ── PROGRESS BAR ── */
.level-progress-bar{height:6px;background:rgba(76,175,80,.12);position:relative;z-index:2}
.level-progress-fill{height:100%;background:linear-gradient(90deg,var(--green-leaf),#81c784);transition:width .5s ease;border-radius:0 4px 4px 0}

/* ── MAIN ── */
main{position:relative;z-index:2;max-width:960px;margin:0 auto;width:100%;padding:32px 24px 90px;flex:1}

.level-tag{
  display:inline-flex;align-items:center;gap:7px;
  border:1.5px solid rgba(46,125,50,.3);background:rgba(76,175,80,.12);
  padding:4px 18px;border-radius:99px;
  font-family:var(--body);font-size:.62rem;letter-spacing:.18em;color:var(--green-mid);
  text-transform:uppercase;font-weight:700;margin-bottom:18px;
}
.level-tag::before{content:'🌿';font-size:.7rem;animation:leafFloat 3s ease-in-out infinite alternate}

/* ── GAME LAYOUT ── */
.game-layout{display:grid;grid-template-columns:160px 1fr;gap:28px;align-items:start}
@media(max-width:640px){.game-layout{grid-template-columns:1fr}}

/* ── ROBOT SIDE ── */
.robot-side{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:10px}
.speech-bubble{
  background:var(--surface);border:2px solid var(--correct);
  border-radius:16px;padding:10px 14px;font-size:.8rem;
  text-align:center;line-height:1.5;max-width:155px;
  color:var(--text-mid);font-weight:600;
  animation:pop .3s ease;position:relative;
  box-shadow:0 4px 16px rgba(39,199,111,.15);
}
.speech-bubble.wrong-bubble{border-color:var(--wrong);box-shadow:0 4px 16px rgba(232,64,64,.12)}
.speech-bubble::after{content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid var(--correct)}
.speech-bubble.wrong-bubble::after{border-top-color:var(--wrong)}
.robot-emoji{font-size:5.5rem;line-height:1;transition:filter .3s;animation:robotFloat 3s ease-in-out infinite}
.robot-emoji.happy{filter:drop-shadow(0 0 18px rgba(245,200,0,.6));animation:bounce .6s ease}
.robot-emoji.sad{animation:shake .4s ease}
.robot-name{font-family:var(--head);font-size:.65rem;letter-spacing:.2em;color:var(--green-mid)}
.robot-status{font-size:.7rem;color:var(--text-muted);margin-top:2px;font-weight:500}

/* ── QUIZ SIDE ── */
.quiz-side{display:flex;flex-direction:column;gap:16px}

.lesson-tip{
  display:flex;align-items:flex-start;gap:12px;
  background:rgba(245,200,0,.08);border:1.5px solid rgba(245,200,0,.3);
  border-radius:14px;padding:14px 16px;
  font-size:.85rem;color:var(--text-mid);line-height:1.6;font-weight:500;
  animation:slideIn .4s ease;
}
.tip-icon{font-size:1.2rem;flex-shrink:0;margin-top:1px}
.btn-gotit{
  background:rgba(245,200,0,.15);border:1.5px solid rgba(245,200,0,.4);
  border-radius:8px;color:#b8860b;font-family:var(--head);font-size:.55rem;
  letter-spacing:.1em;padding:5px 12px;cursor:pointer;white-space:nowrap;
  flex-shrink:0;margin-top:2px;transition:all .2s;
}
.btn-gotit:hover{background:rgba(245,200,0,.28)}

.level-title{font-family:var(--head);font-size:1.1rem;color:var(--green-dark);letter-spacing:.02em}

/* code block */
.code-block{border-radius:16px;overflow:hidden;border:1.5px solid rgba(76,175,80,.2);box-shadow:var(--shadow-card)}
.code-topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--green-dark);border-bottom:1px solid rgba(255,255,255,.1)}
.code-lang{font-size:.68rem;color:rgba(255,255,255,.6);letter-spacing:.1em}
.code-run{font-size:.68rem;color:var(--green-light);letter-spacing:.06em;font-family:var(--mono)}
.code-body{background:#1a3d1a;padding:16px 20px;font-family:var(--mono);font-size:.95rem;line-height:1.8;color:#a5d6a7}
.fn{color:#81c784}.str{color:var(--gold-soft)}.paren{color:rgba(165,214,167,.7)}

.question-label{font-family:var(--body);font-size:.72rem;letter-spacing:.12em;color:var(--orange);text-transform:uppercase;font-weight:700}

/* choices */
.choices{display:flex;flex-direction:column;gap:9px}
.choice-btn{
  display:flex;align-items:center;gap:14px;padding:13px 16px;
  border-radius:14px;cursor:pointer;
  border:2px solid var(--border);background:var(--surface);
  color:var(--text);font-family:var(--body);font-size:.88rem;
  text-align:left;transition:all .2s;white-space:pre-line;
  box-shadow:var(--shadow-card);
}
.choice-btn:hover:not(:disabled){border-color:rgba(76,175,80,.5);background:rgba(76,175,80,.06);transform:translateX(3px);box-shadow:var(--shadow-strong)}
.choice-btn:disabled{cursor:default}
.choice-btn.correct-ans{border-color:var(--correct);background:rgba(39,199,111,.08);box-shadow:0 0 16px rgba(39,199,111,.15)}
.choice-btn.wrong-ans{border-color:var(--wrong);background:rgba(232,64,64,.07)}
.choice-label{width:28px;height:28px;border-radius:8px;background:rgba(76,175,80,.1);border:1.5px solid rgba(76,175,80,.25);display:grid;place-items:center;font-family:var(--head);font-size:.65rem;flex-shrink:0;color:var(--green-mid)}
.choice-text{font-family:var(--mono);flex:1;color:var(--text-mid)}

/* after-answer */
.after-answer{text-align:center;animation:slideIn .3s ease;display:flex;flex-direction:column;align-items:center;gap:12px}
.stars-earned{font-family:var(--head);font-size:1rem;color:#b8860b;letter-spacing:.06em}
.wrong-hint{font-size:.84rem;color:var(--text-muted);font-weight:500}
.wrong-hint b{color:var(--wrong)}
.btn-next-q{
  padding:13px 32px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#43a047,#2e7d32);
  color:#fff;font-family:var(--head);font-size:.78rem;
  cursor:pointer;letter-spacing:.06em;
  box-shadow:0 4px 18px rgba(46,125,50,.3);
  position:relative;overflow:hidden;transition:all .2s;
}
.btn-next-q::after{content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shine 2s linear infinite}
.btn-next-q:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(46,125,50,.45)}

/* ── COMPLETE SCREEN ── */
.complete-screen{
  position:fixed;inset:0;z-index:500;
  background:rgba(200,230,200,.65);backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .35s;
}
.complete-screen.active{opacity:1;pointer-events:all}
.complete-box{
  background:var(--surface);
  border:2px solid rgba(76,175,80,.3);
  border-radius:28px;padding:44px 36px 36px;
  max-width:500px;width:100%;text-align:center;
  position:relative;
  box-shadow:0 20px 60px rgba(46,125,50,.2), 0 0 0 8px rgba(76,175,80,.07);
  transform:scale(.7) translateY(30px);
  transition:transform .45s cubic-bezier(.175,.885,.32,1.275);
}
.complete-screen.active .complete-box{transform:scale(1) translateY(0)}
.complete-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--green-leaf),var(--gold-soft),var(--green-leaf));
  background-size:200% 100%;animation:gradShift 3s linear infinite;
  border-radius:28px 28px 0 0;
}
.complete-robot{font-size:5rem;margin-bottom:12px;display:block;animation:robotFloat 2.5s ease-in-out infinite}
.complete-title{font-family:var(--head);font-size:1.6rem;color:var(--green-dark);letter-spacing:.02em;margin-bottom:8px}
.complete-sub{font-size:.9rem;color:var(--text-muted);margin-bottom:20px;line-height:1.6;font-weight:500}
.stars-row{display:flex;justify-content:center;gap:8px;margin-bottom:6px}
.star-item{font-size:2.2rem;opacity:0;transform:scale(0) rotate(-40deg);display:inline-block}
.star-item.pop{animation:starBurst .55s cubic-bezier(.175,.885,.32,1.275) forwards}
.star-item.pop:nth-child(2){animation-delay:.15s}
.star-item.pop:nth-child(3){animation-delay:.3s}
.score-summary{
  background:var(--surface2);border:1.5px solid var(--border);
  border-radius:18px;padding:20px;margin-bottom:18px;
}
.score-big{font-family:var(--head);font-size:2rem;color:var(--green-dark)}
.score-label{font-size:.78rem;color:var(--text-muted);margin-top:4px;letter-spacing:.08em;font-weight:600}
.score-detail{font-size:.88rem;color:var(--text-mid);margin-top:10px;font-weight:500}
.unlock-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(39,199,111,.1);border:1.5px solid var(--correct);
  border-radius:99px;padding:8px 20px;
  font-family:var(--head);font-size:.7rem;color:var(--correct);
  margin-bottom:18px;letter-spacing:.05em;
  animation:unlockPulse 1.8s ease-in-out infinite;
}
.complete-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn-complete{
  flex:1;min-width:130px;padding:14px 20px;border-radius:14px;border:none;
  color:#fff;font-family:var(--head);font-size:.72rem;
  cursor:pointer;letter-spacing:.07em;text-transform:uppercase;transition:all .2s;
  position:relative;overflow:hidden;
}
.btn-complete.primary{background:linear-gradient(135deg,#43a047,#2e7d32);box-shadow:0 4px 18px rgba(46,125,50,.3);animation:btnPulse 2s ease-in-out infinite}
.btn-complete.primary::after{content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shine 2.2s linear infinite}
.btn-complete.secondary{background:var(--surface2);border:1.5px solid var(--border);color:var(--text-mid)}
.btn-complete:hover{transform:translateY(-2px)}
.redirect-note{font-size:.72rem;color:var(--text-muted);margin-top:12px;letter-spacing:.04em;font-weight:500}
.redirect-note span{color:var(--green-mid);font-family:var(--head)}

/* confetti */
.confetti-piece{position:fixed;border-radius:2px;animation:confettiFall linear forwards;z-index:9999;pointer-events:none}

/* ── STATS BAR ── */
.stats-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:52px;background:rgba(30,92,30,.97);
  backdrop-filter:blur(20px);border-top:1.5px solid rgba(165,214,167,.2);
  box-shadow:0 -2px 20px rgba(30,92,30,.15);
  display:flex;align-items:center;justify-content:center;gap:40px;
}
.sitem{display:flex;align-items:center;gap:7px;font-size:.78rem;letter-spacing:.06em;color:rgba(255,255,255,.75);font-weight:600}
.sval{font-family:var(--head);font-size:.82rem;letter-spacing:.03em}
</style>
</head>
<body>

<!-- Floating leaves -->
<div class="leaf-deco">🍃</div>
<div class="leaf-deco">🌿</div>
<div class="leaf-deco">🍀</div>
<div class="leaf-deco">🌱</div>
<div class="leaf-deco">🍃</div>

<!-- NAV -->
<nav>
  <div class="logo"><span class="logo-leaf">🌿</span><span>CODEPLAY</span></div>
  <div class="nav-center">
    <div class="nav-pip"></div>
    <div>
      <div class="nav-lesson-tag">Part 1 · Lesson 05 · Quiz</div>
      <div class="nav-lesson-title">Robot Talks — print() Game</div>
    </div>
  </div>
  <div class="nav-right">
    <div class="stars-pill">⭐ <span id="starDisplay">0</span> stars</div>
    <button class="btn-back" onclick="location.href='lesson5.html'">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
  </div>
</nav>

<!-- PROGRESS BAR -->
<div class="level-progress-bar">
  <div class="level-progress-fill" id="progressFill" style="width:0%"></div>
</div>

<!-- MAIN -->
<main id="gameMain">
  <div class="level-tag" id="levelTag">Level 1 of 8</div>
  <div class="game-layout">

    <!-- Robot -->
    <div class="robot-side">
      <div id="speechBubble" style="display:none"></div>
      <div class="robot-emoji" id="robotEmoji">🤖</div>
      <div class="robot-name">ROBO-5</div>
      <div class="robot-status" id="robotStatus">Ready to speak!</div>
    </div>

    <!-- Quiz -->
    <div class="quiz-side" id="quizSide"></div>

  </div>
</main>

<!-- COMPLETE SCREEN -->
<div class="complete-screen" id="completeScreen">
  <div class="complete-box">
    <span class="complete-robot">🤖</span>
    <div class="stars-row">
      <span class="star-item" id="cStar1">⭐</span>
      <span class="star-item" id="cStar2">⭐</span>
      <span class="star-item" id="cStar3">⭐</span>
    </div>
    <div class="complete-title" id="cTitle">YOU DID IT!</div>
    <div class="complete-sub" id="cSub">You taught the robot to talk!</div>
    <div class="score-summary">
      <div class="score-big" id="cStars">⭐ 0</div>
      <div class="score-label">STARS COLLECTED</div>
      <div class="score-detail" id="cScore">0 / 8 correct</div>
    </div>
    <div class="unlock-badge" id="unlockBadge">🔓 Lesson 06 Unlocked!</div>
    <div class="complete-btns">
      <button class="btn-complete secondary" onclick="restartGame()">🔄 Play Again</button>
      <button class="btn-complete primary" onclick="goToLessons()">🏠 Go to Lessons!</button>
    </div>
    <div class="redirect-note" id="redirectNote">Redirecting in <span id="countdownSpan">8</span>s…</div>
  </div>
</div>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="sitem">📍 <span class="sval" style="color:var(--gold-soft)">Part 1</span>&nbsp;<span style="color:rgba(255,255,255,.4);font-size:.72rem">Lesson 05</span></div>
  <div class="sitem">⭐ <span class="sval" style="color:var(--gold-soft)" id="statStars">0</span>&nbsp;<span style="color:rgba(255,255,255,.4);font-size:.72rem">stars</span></div>
  <div class="sitem">🎯 <span class="sval" id="statLevel" style="color:#fff">1/8</span>&nbsp;<span style="color:rgba(255,255,255,.4);font-size:.72rem">Levels</span></div>
  <div class="sitem">✅ <span class="sval" style="color:var(--correct)" id="statCorrect">0</span>&nbsp;<span style="color:rgba(255,255,255,.4);font-size:.72rem">Correct</span></div>
</div>

<script>
const LEVELS=[
  {id:1,title:'Wake Up, Robot! 🤖',tip:'print() makes the robot SPEAK! Whatever you put inside the " " comes out!',code:'print("Hello!")',choices:['Hello!','print','Hello','"Hello!"'],answer:'Hello!',stars:1},
  {id:2,title:'Robot Says Hi 👋',tip:'The robot says EXACTLY what is between the quotes. Nothing more, nothing less!',code:'print("Hi there!")',choices:['Hi','Hi there!','Hello there!','there!'],answer:'Hi there!',stars:1},
  {id:3,title:'Robot Loves Food 🍕',tip:'You can make the robot say ANYTHING — even food!',code:'print("I love pizza!")',choices:['pizza!','I love pizza!','I love food!','print pizza'],answer:'I love pizza!',stars:2},
  {id:4,title:'Robot Count! 🔢',tip:'Numbers inside quotes are still words for the robot — it just says them!',code:'print("123")',choices:['123','one two three','"123"','print 123'],answer:'123',stars:2},
  {id:5,title:'Robot Emoji! 🌟',tip:'Emojis work too! The robot can express feelings!',code:'print("I am happy 😊")',choices:['I am happy','happy 😊','I am happy 😊','😊'],answer:'I am happy 😊',stars:2},
  {id:6,title:'Robot Double Speak! 🗣️',tip:'Two print() commands = the robot speaks TWICE, one line at a time!',code:'print("Line 1")\nprint("Line 2")',choices:['Line 1 Line 2','Line 1\nLine 2','Line2','print Line 1\nprint Line 2'],answer:'Line 1\nLine 2',stars:3},
  {id:7,title:'Robot Name! 🏷️',tip:'Make the robot introduce itself!',code:'print("My name is ROBO!")',choices:['ROBO!','My name is','My name is ROBO!','name is ROBO'],answer:'My name is ROBO!',stars:3},
  {id:8,title:'Mystery Robot! 🔍',tip:'Tricky one! What does the robot say? Look carefully at the quotes!',code:'print("print is fun!")',choices:['fun!','print is fun!','print','"print is fun!"'],answer:'print is fun!',stars:3},
];

const CORRECT_MSGS=['Beep boop! You got it! ⚡','CORRECT! I am so happy! 🎉','Amazing! You speak robot! 🤖','Wow wow wow! Brilliant! ⭐','YES! High five human! ✋'];
const WRONG_MSGS=['Bzzt! Try again! 🔄','Hmm, look at the quotes!','Not quite! You can do it! 💪','Oops! Read carefully! 👀'];

let currentLevel=0,score=0,totalStars=0,answered=false,redirectTimer=null;

function formatCode(code){
  return code.split('\n').map(line=>{
    const m=line.match(/^(print)(\()(".*?")(\))$/);
    if(!m)return`<span style="color:#a5d6a7">${line}</span>`;
    return`<span class="fn">${m[1]}</span><span class="paren">${m[2]}</span><span class="str">${m[3]}</span><span class="paren">${m[4]}</span>`;
  }).join('<br>');
}

function renderLevel(){
  const lv=LEVELS[currentLevel];
  answered=false;
  const pct=Math.round((currentLevel/LEVELS.length)*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('levelTag').textContent=`Level ${currentLevel+1} of ${LEVELS.length}`;
  document.getElementById('statLevel').textContent=`${currentLevel+1}/${LEVELS.length}`;
  setRobot('idle');hideBubble();

  const qs=document.getElementById('quizSide');
  qs.innerHTML='';
  qs.style.animation='none';void qs.offsetWidth;qs.style.animation='slideIn .4s ease';

  const tipDiv=document.createElement('div');
  tipDiv.className='lesson-tip';tipDiv.id='lessonTip';
  tipDiv.innerHTML=`<span class="tip-icon">💡</span><span style="flex:1">${lv.tip}</span><button class="btn-gotit" onclick="document.getElementById('lessonTip').style.display='none'">Got it! →</button>`;
  qs.appendChild(tipDiv);

  const titleDiv=document.createElement('div');
  titleDiv.className='level-title';titleDiv.textContent=lv.title;
  qs.appendChild(titleDiv);

  const codeDiv=document.createElement('div');
  codeDiv.className='code-block';
  codeDiv.innerHTML=`<div class="code-topbar"><span class="code-lang">🐍 Python Code</span><span class="code-run">▶ Run</span></div><div class="code-body">${formatCode(lv.code)}</div>`;
  qs.appendChild(codeDiv);

  const qLabel=document.createElement('div');
  qLabel.className='question-label';
  qLabel.textContent='What will ROBO-5 say? 👇';
  qs.appendChild(qLabel);

  const choicesDiv=document.createElement('div');
  choicesDiv.className='choices';choicesDiv.id='choicesWrap';
  lv.choices.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.innerHTML=`<span class="choice-label">${['A','B','C','D'][i]}</span><span class="choice-text">${c.replace(/\n/g,'↵\n')}</span>`;
    btn.onclick=()=>handleChoice(c,btn,lv);
    choicesDiv.appendChild(btn);
  });
  qs.appendChild(choicesDiv);

  const afterDiv=document.createElement('div');
  afterDiv.id='afterAnswer';afterDiv.style.display='none';
  qs.appendChild(afterDiv);
}

function handleChoice(choice,btn,lv){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  const correct=choice===lv.answer;

  document.querySelectorAll('.choice-btn').forEach(b=>{
    const t=b.querySelector('.choice-text').textContent.replace('↵\n','\n');
    if(t===lv.answer){b.classList.add('correct-ans');b.querySelector('.choice-label').textContent='✅'}
    else if(b===btn&&!correct){b.classList.add('wrong-ans');b.querySelector('.choice-label').textContent='❌'}
  });

  if(correct){
    score++;totalStars+=lv.stars;updateStats();
    setRobot('happy');
    showBubble(CORRECT_MSGS[Math.floor(Math.random()*CORRECT_MSGS.length)],true);
  }else{
    setRobot('sad');
    showBubble(WRONG_MSGS[Math.floor(Math.random()*WRONG_MSGS.length)],false);
  }

  const after=document.getElementById('afterAnswer');
  after.style.display='block';after.className='after-answer';after.innerHTML='';

  if(correct){
    const se=document.createElement('div');se.className='stars-earned';
    se.textContent='⭐'.repeat(lv.stars)+' +'+lv.stars+' '+(lv.stars===1?'star':'stars')+'!';
    after.appendChild(se);
  }else{
    const hint=document.createElement('div');hint.className='wrong-hint';
    hint.innerHTML=`The answer was: <b>${lv.answer}</b>`;
    after.appendChild(hint);
  }

  const nextQ=document.createElement('button');
  nextQ.className='btn-next-q';
  nextQ.textContent=currentLevel+1>=LEVELS.length?'🏁 Finish!':'Next Level →';
  nextQ.onclick=()=>nextLevel();
  after.appendChild(nextQ);
}

function nextLevel(){
  hideBubble();
  if(currentLevel+1>=LEVELS.length){showComplete();return;}
  currentLevel++;renderLevel();
}

function setRobot(mood){
  const el=document.getElementById('robotEmoji');
  const st=document.getElementById('robotStatus');
  el.className='robot-emoji';
  if(mood==='happy'){el.textContent='🤩';el.classList.add('happy');el.style.filter='drop-shadow(0 0 18px rgba(245,200,0,.6))';st.textContent='Yay!!'}
  else if(mood==='sad'){el.textContent='😢';el.classList.add('sad');el.style.filter='none';st.textContent='Oops...'}
  else{el.textContent='🤖';el.style.filter='none';st.textContent='Ready to speak!'}
}
function showBubble(text,correct){
  const b=document.getElementById('speechBubble');
  b.textContent=text;b.className='speech-bubble '+(correct?'':'wrong-bubble');
  b.style.display='block';b.style.animation='none';void b.offsetWidth;b.style.animation='pop .3s ease';
}
function hideBubble(){document.getElementById('speechBubble').style.display='none'}

function updateStats(){
  document.getElementById('starDisplay').textContent=totalStars;
  document.getElementById('statStars').textContent=totalStars;
  document.getElementById('statCorrect').textContent=score;
}

function showComplete(){
  localStorage.setItem('lesson05Completed','yes');
  const cur=parseInt(localStorage.getItem('part1_progress'))||1;
  if(cur<6)localStorage.setItem('part1_progress','6');

  document.getElementById('cStars').textContent='⭐ '+totalStars;
  document.getElementById('cScore').textContent=score+' / '+LEVELS.length+' correct';
  const perfect=score===LEVELS.length,great=score>=6;
  document.getElementById('cTitle').textContent=perfect?'PERFECT SCORE! 🏆':great?'Amazing Work! 🎊':'You Did It! 🤖';
  document.getElementById('cSub').textContent=perfect?'Every single answer was correct! Incredible!':great?'You really understand how print() works!':'Keep practising — you\'re getting there!';

  document.getElementById('completeScreen').classList.add('active');
  setTimeout(()=>['cStar1','cStar2','cStar3'].forEach(id=>document.getElementById(id).classList.add('pop')),350);
  launchConfetti(80);

  let secs=8;
  const cd=document.getElementById('countdownSpan');
  redirectTimer=setInterval(()=>{secs--;cd.textContent=secs;if(secs<=0){clearInterval(redirectTimer);window.location.href='quest1.html'}},1000);
}

function goToLessons(){if(redirectTimer)clearInterval(redirectTimer);window.location.href='quest1.html'}

function restartGame(){
  if(redirectTimer)clearInterval(redirectTimer);
  document.getElementById('completeScreen').classList.remove('active');
  ['cStar1','cStar2','cStar3'].forEach(id=>document.getElementById(id).classList.remove('pop'));
  currentLevel=0;score=0;totalStars=0;answered=false;
  updateStats();renderLevel();
}

function launchConfetti(n){
  const cols=['#f5e000','#27c76f','#ff8c00','#a5d6a7','#ffffff','#4caf50','#ffe066'];
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const p=document.createElement('div');p.className='confetti-piece';
      p.style.left=Math.random()*100+'vw';p.style.top='0';
      p.style.background=cols[Math.floor(Math.random()*cols.length)];
      p.style.width=(7+Math.random()*9)+'px';p.style.height=(11+Math.random()*12)+'px';
      p.style.borderRadius=Math.random()>.5?'50%':'2px';
      p.style.animationDuration=(2.2+Math.random()*2.8)+'s';
      p.style.animationDelay=(Math.random()*.6)+'s';
      document.body.appendChild(p);setTimeout(()=>p.remove(),6000);
    },i*28);
  }
}

function handleBack(){if(confirm('Go back to lessons?'))window.location.href='quest1.html'}

renderLevel();
</script>
</body>
</html>
