<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CODEPLAY — Numbers in Boxes!</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Nunito:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
:root{
  /* === MAGICAL ASTRO LIGHT THEME === */
  --bg:#dff6f4;
  --bg2:#e8f5f8;
  --bg3:#ede8f8;
  --card:#ffffff;
  --card2:#f4fbfc;
  --border:rgba(0,175,185,.18);
  --border2:rgba(120,90,200,.13);

  --cyan:#00b4c5;
  --cyan-soft:rgba(0,180,197,.12);
  --purple:#7c52e8;
  --purple-soft:rgba(124,82,232,.1);
  --gold:#e8900a;
  --gold-soft:rgba(232,144,10,.12);
  --green:#00b87a;
  --green-soft:rgba(0,184,122,.1);
  --red:#e83d5c;
  --red-soft:rgba(232,61,92,.08);

  --text:#1a2e2e;
  --text2:#2d4a48;
  --muted:#7a9e9e;
  --muted2:#a8c5c5;

  --nav:#1b3a30;
  --nav-border:rgba(0,200,160,.18);

  --shadow-sm:0 2px 12px rgba(0,150,160,.1);
  --shadow-md:0 6px 28px rgba(0,150,160,.14);
  --shadow-lg:0 16px 56px rgba(0,150,160,.18);

  --mono:'Share Tech Mono',monospace;
  --head:'Orbitron',sans-serif;
  --body:'Nunito',sans-serif;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:var(--body);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* === LIGHT BACKGROUND MESH === */
body::before{
  content:'';
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse 70% 60% at 15% 10%, rgba(180,240,235,.55) 0%, transparent 60%),
    radial-gradient(ellipse 55% 50% at 85% 5%,  rgba(200,215,255,.45) 0%, transparent 55%),
    radial-gradient(ellipse 60% 55% at 75% 90%, rgba(220,200,255,.4)  0%, transparent 60%),
    radial-gradient(ellipse 65% 50% at 10% 85%, rgba(170,240,220,.4)  0%, transparent 55%),
    linear-gradient(160deg, #d4f4f0 0%, #dde8f8 40%, #e8dff8 100%);
}

/* floating blobs */
.nb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px);opacity:.5}
.nb1{width:700px;height:700px;top:-200px;left:-200px;background:radial-gradient(circle,rgba(0,200,185,.18),transparent 65%);animation:nb 28s ease-in-out infinite alternate}
.nb2{width:600px;height:600px;bottom:-180px;right:-180px;background:radial-gradient(circle,rgba(160,120,255,.15),transparent 65%);animation:nb2 22s ease-in-out infinite alternate-reverse}
.nb3{width:400px;height:400px;top:40%;left:60%;background:radial-gradient(circle,rgba(0,220,200,.1),transparent 65%);animation:nb 34s ease-in-out infinite alternate}
@keyframes nb{to{transform:translate(30px,20px)scale(1.08)}}
@keyframes nb2{to{transform:translate(-30px,20px)scale(1.08)}}

/* floating orbs / stars */
#cvs{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(0) rotate(-10deg)}70%{transform:scale(1.25) rotate(4deg)}100%{transform:scale(1) rotate(0deg)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes shine{to{left:160%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spinR{to{transform:rotate(360deg)}}

/* === NAV === */
nav{
  position:sticky;top:0;z-index:200;width:100%;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;
  background:var(--nav);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--nav-border);
  box-shadow:0 2px 16px rgba(0,0,0,.18);
}
.logo{
  font-family:var(--head);font-weight:900;font-size:1.2rem;
  color:#ff8c00;letter-spacing:.06em;display:flex;align-items:center;gap:8px;
}
.nav-stars{display:flex;gap:4px;font-size:1.1rem}
.star-icon{filter:grayscale(1)brightness(.4);transition:filter .4s,transform .3s}
.star-icon.lit{filter:none;transform:scale(1.15)}
.btn-back{
  padding:8px 20px;border-radius:99px;
  border:1.5px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.08);color:#c8ece8;
  font-family:var(--body);font-size:.9rem;font-weight:700;
  cursor:pointer;transition:all .2s;
}
.btn-back:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5);color:#fff}

/* === XP BAR === */
.xp-bar-wrap{
  position:relative;z-index:1;width:100%;max-width:680px;
  padding:14px 20px 0;display:flex;align-items:center;gap:14px;
}
.xp-label{font-family:var(--head);font-size:.6rem;letter-spacing:.14em;color:var(--gold);white-space:nowrap}
.xp-track{flex:1;height:10px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.xp-fill{
  height:100%;
  background:linear-gradient(90deg,#00c5a8,#e8900a);
  border-radius:99px;
  transition:width .5s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 0 10px rgba(0,197,168,.4);
}
.xp-count{font-family:var(--head);font-size:.72rem;font-weight:700;color:var(--gold);white-space:nowrap;min-width:52px;text-align:right}

/* === STAGE DOTS === */
.stage-row{
  position:relative;z-index:1;
  display:flex;gap:8px;padding:12px 20px;
  justify-content:center;flex-wrap:wrap;
  max-width:680px;width:100%;
}
.stage-dot{
  width:36px;height:36px;border-radius:50%;
  border:2px solid rgba(0,0,0,.1);
  background:rgba(255,255,255,.5);
  display:grid;place-items:center;
  font-size:.7rem;font-family:var(--head);
  color:var(--muted);
  transition:all .35s;position:relative;
  box-shadow:var(--shadow-sm);
}
.stage-dot.done{border-color:var(--green);background:var(--green-soft);color:var(--green);box-shadow:0 0 10px rgba(0,184,122,.2)}
.stage-dot.active{
  border-color:var(--cyan);
  background:var(--cyan-soft);
  color:var(--cyan);
  box-shadow:0 0 14px rgba(0,180,197,.4);
  animation:blink 1.4s infinite;
}
.stage-dot.done::after{content:'✓';position:absolute;font-size:.75rem;font-weight:900}

/* === GAME CARD === */
.game-card{
  position:relative;z-index:1;width:100%;max-width:680px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:32px 28px;
  margin:8px 20px 20px;
  overflow:hidden;
  animation:fadeUp .4s ease both;
  box-shadow:var(--shadow-lg);
}
.game-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);
}
/* subtle inner glow */
.game-card::after{
  content:'';position:absolute;inset:0;border-radius:24px;pointer-events:none;
  background:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(0,200,185,.06),transparent 70%);
}

/* === ROBOT CHARACTER === */
.robo-wrap{display:flex;justify-content:center;margin-bottom:18px}
.robo{font-size:3.8rem;animation:float 2.5s ease-in-out infinite;display:inline-block;cursor:default;user-select:none}
.robo.happy{animation:wobble .5s ease}
.robo.sad{animation:shake .4s ease}

/* === QUESTION BUBBLE === */
.q-bubble{
  background:linear-gradient(135deg,rgba(0,180,197,.08),rgba(124,82,232,.06));
  border:1.5px solid rgba(0,180,197,.22);
  border-radius:16px;padding:16px 20px;
  text-align:center;margin-bottom:22px;position:relative;
}
.q-bubble::before{
  content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:10px solid transparent;border-right:10px solid transparent;
  border-top:10px solid rgba(0,180,197,.22);
}
.q-text{font-size:1.1rem;font-weight:800;color:var(--text);line-height:1.4}
.q-sub{font-size:.88rem;color:var(--muted);margin-top:6px;font-weight:600}

/* === CODE SNIPPET === */
.code-snip{
  background:linear-gradient(135deg,#f0fafa,#f5f0ff);
  border:1.5px solid rgba(0,180,197,.18);
  border-radius:14px;padding:16px 18px;
  font-family:var(--mono);font-size:.95rem;line-height:1.9;
  margin-bottom:20px;text-align:left;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.04), var(--shadow-sm);
  position:relative;
}
.code-snip::before{
  content:'● ● ●';position:absolute;top:8px;left:14px;
  font-size:.65rem;letter-spacing:.2em;color:var(--muted2);
}
.code-snip>*{display:block;margin-top:8px}
.kw{color:var(--purple)}.str{color:var(--gold)}.num{color:var(--green)}.fn{color:var(--cyan)}.cm{color:var(--muted2);font-style:italic}.var{color:#c05820}.out{color:var(--cyan)}

/* === CHOICE BUTTONS === */
.choices{display:grid;gap:12px;margin-bottom:18px}
.choices.grid2{grid-template-columns:1fr 1fr}
.choice-btn{
  padding:16px 18px;border-radius:14px;
  border:2px solid rgba(0,180,197,.18);
  background:linear-gradient(135deg,#f8fefe,#f4f8ff);
  color:var(--text);
  font-family:var(--body);font-size:1rem;font-weight:800;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:12px;text-align:left;line-height:1.35;
  position:relative;overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.choice-btn:hover{
  border-color:var(--cyan);
  background:linear-gradient(135deg,rgba(0,180,197,.08),rgba(0,180,197,.04));
  transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,180,197,.2);
}
.choice-btn.picked{border-color:var(--cyan);background:rgba(0,180,197,.1)}
.choice-btn.correct{border-color:var(--green);background:var(--green-soft);animation:pop .35s ease}
.choice-btn.wrong{border-color:var(--red);background:var(--red-soft);animation:shake .3s ease}
.choice-btn.dimmed{opacity:.35;pointer-events:none}
.choice-emoji{font-size:1.6rem;flex-shrink:0}
.choice-code{font-family:var(--mono);font-size:.88rem;color:var(--text2)}

/* === OUTPUT PICK === */
.output-choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.out-chip{
  padding:14px 24px;border-radius:12px;
  border:2px solid rgba(0,180,197,.2);
  background:linear-gradient(135deg,#f8fefe,#f4f8ff);
  font-family:var(--mono);font-size:1.3rem;font-weight:700;
  color:var(--text);cursor:pointer;transition:all .2s;
  min-width:80px;text-align:center;
  box-shadow:var(--shadow-sm);
}
.out-chip:hover{border-color:var(--cyan);background:var(--cyan-soft);transform:scale(1.08);box-shadow:0 6px 20px rgba(0,180,197,.2)}
.out-chip.correct{border-color:var(--green);background:var(--green-soft);animation:pop .35s ease}
.out-chip.wrong{border-color:var(--red);background:var(--red-soft);animation:shake .3s ease}
.out-chip.dimmed{opacity:.3;pointer-events:none}

/* === MATCH GAME === */
.match-wrap{display:flex;gap:16px;justify-content:center;margin-bottom:18px}
.match-col{display:flex;flex-direction:column;gap:12px;min-width:130px;max-width:210px;flex:1}
.match-col-lbl{font-family:var(--head);font-size:.55rem;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;text-align:center;margin-bottom:2px}
.match-card{
  padding:14px 10px;border-radius:14px;
  border:2.5px solid rgba(0,180,197,.18);
  background:linear-gradient(135deg,#f8fefe,#f4f8ff);
  text-align:center;cursor:pointer;transition:all .22s;
  user-select:none;box-shadow:var(--shadow-sm);
}
.match-card:hover{transform:scale(1.06);border-color:var(--cyan);background:var(--cyan-soft)}
.match-card.selected{border-color:var(--cyan);background:var(--cyan-soft);box-shadow:0 0 18px rgba(0,180,197,.3);transform:scale(1.07)}
.match-card.matched{border-color:var(--green);background:var(--green-soft);pointer-events:none;animation:pop .35s ease}
.match-card.wrong-flash{border-color:var(--red);background:var(--red-soft);animation:shake .3s ease}
.match-card.dimmed{opacity:.28;pointer-events:none}
.match-name{font-family:var(--mono);font-size:.95rem;font-weight:700;color:var(--cyan)}
.match-emoji{font-size:1.5rem;margin-bottom:4px;display:block}
.match-num{font-family:var(--mono);font-size:1.7rem;font-weight:900;color:var(--text)}

/* === FEEDBACK === */
.feedback{
  border-radius:14px;padding:14px 18px;
  font-size:1rem;font-weight:700;line-height:1.45;
  display:none;align-items:center;gap:12px;margin-bottom:16px;text-align:left;
}
.feedback.show{display:flex;animation:fadeUp .3s ease}
.feedback.ok{background:var(--green-soft);border:2px solid rgba(0,184,122,.3);color:#006644}
.feedback.bad{background:var(--red-soft);border:2px solid rgba(232,61,92,.25);color:#a0001e}
.fb-ico{font-size:2rem;flex-shrink:0}

/* === NEXT BUTTON === */
.btn-next{
  width:100%;padding:16px;border-radius:14px;border:none;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  color:#fff;font-family:var(--body);font-size:1.1rem;font-weight:900;
  cursor:pointer;letter-spacing:.04em;
  box-shadow:0 4px 24px rgba(0,180,197,.35);
  transition:all .25s;position:relative;overflow:hidden;display:none;
}
.btn-next.show{display:block;animation:fadeUp .3s ease}
.btn-next::after{
  content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
  animation:shine 2s linear infinite;
}
.btn-next:hover{transform:translateY(-3px);box-shadow:0 8px 36px rgba(0,180,197,.5)}

/* === FINISH === */
.finish-wrap{
  position:relative;z-index:1;width:100%;max-width:680px;
  display:none;flex-direction:column;align-items:center;
  gap:20px;padding:20px 20px 80px;text-align:center;
  animation:fadeUp .5s ease both;
}
.finish-wrap.show{display:flex}
.finish-trophy{font-size:6rem;animation:pop .6s cubic-bezier(.175,.885,.32,1.275) both;display:inline-block}
.finish-title{
  font-family:var(--head);font-size:1.8rem;font-weight:900;
  background:linear-gradient(105deg,var(--gold),var(--cyan),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.finish-msg{font-size:1.1rem;font-weight:700;color:var(--muted);max-width:400px}
.score-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.sc{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:16px;padding:20px 28px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:var(--shadow-md);
}
.sc-num{font-family:var(--head);font-size:2rem;font-weight:900}
.sc-lbl{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.star-big-row{display:flex;gap:8px;justify-content:center}
.star-big{font-size:3rem;filter:grayscale(1)brightness(.5);transition:all .4s}
.star-big.lit{filter:none;animation:pop .45s cubic-bezier(.175,.885,.32,1.275) both}
.btn-finish{
  padding:16px 44px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#00c5a8,#00b4c5);
  color:#fff;font-family:var(--body);font-size:1.1rem;font-weight:900;
  cursor:pointer;box-shadow:0 4px 28px rgba(0,180,197,.4);
  transition:all .25s;position:relative;overflow:hidden;
}
.btn-finish::after{
  content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  animation:shine 2s linear infinite;
}
.btn-finish:hover{transform:translateY(-3px);box-shadow:0 8px 40px rgba(0,180,197,.6)}
.btn-play-again{
  padding:14px 32px;border-radius:14px;
  border:2px solid rgba(0,180,197,.35);background:rgba(0,180,197,.07);
  color:var(--cyan);font-family:var(--body);font-size:1rem;font-weight:800;
  cursor:pointer;transition:all .2s;
}
.btn-play-again:hover{background:var(--cyan-soft);border-color:var(--cyan)}

/* === STATS BAR === */
.stats-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;height:52px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(18px);
  border-top:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:36px;
  box-shadow:0 -4px 20px rgba(0,150,160,.1);
}
.si{display:flex;align-items:center;gap:7px;font-size:.85rem;font-weight:700;color:var(--text2)}
.sv{font-family:var(--head);font-size:.85rem;font-weight:700}

/* === TOAST === */
.toast-stack{position:fixed;top:76px;right:16px;z-index:9000;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:280px}
.toast{
  background:rgba(255,255,255,.96);backdrop-filter:blur(22px);
  border:1.5px solid var(--border);border-radius:14px;
  padding:12px 14px;display:flex;align-items:center;gap:10px;
  pointer-events:all;position:relative;overflow:hidden;
  animation:tIn .38s cubic-bezier(.22,1,.36,1) both;
  font-weight:700;font-size:.9rem;color:var(--text);
  box-shadow:var(--shadow-md);
}
.toast::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px}
.toast.good::before{background:linear-gradient(90deg,transparent,var(--green),transparent)}
.toast.info::before{background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.toast.gold::before{background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.toast.leaving{animation:tOut .3s ease forwards}
@keyframes tIn{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
@keyframes tOut{from{opacity:1}to{opacity:0;transform:translateX(50px)}}

/* === CONFETTI === */
.cf{position:fixed;border-radius:2px;pointer-events:none;z-index:9999;animation:cfFall linear forwards}
@keyframes cfFall{from{transform:translateY(0)rotate(0deg);opacity:1}to{transform:translateY(110vh)rotate(600deg);opacity:0}}

/* NUMBER BOX DRAG GAME — kept for completeness */
.magic-box{width:110px;height:110px;border-radius:16px;border:3px dashed rgba(0,180,197,.3);background:rgba(0,180,197,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--body);transition:all .2s;position:relative;cursor:default}
.magic-box.over{border-color:var(--cyan);background:var(--cyan-soft);transform:scale(1.06)}
.magic-box.filled{border-style:solid;border-color:rgba(0,180,197,.5)}
.magic-box.correct{border-color:var(--green);background:var(--green-soft);animation:pop .35s ease}
.magic-box.wrong-box{border-color:var(--red);animation:shake .3s ease}
.box-name{font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.box-value{font-family:var(--mono);font-size:1.4rem;font-weight:700;color:var(--cyan)}
.box-emoji{font-size:1.8rem}
.box-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.box-game{display:flex;flex-direction:column;gap:16px;align-items:center}
.number-tokens{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:14px;background:rgba(0,0,0,.03);border-radius:14px;border:1px dashed rgba(0,0,0,.08)}
.num-token{width:62px;height:62px;border-radius:12px;background:linear-gradient(135deg,rgba(0,180,197,.1),rgba(124,82,232,.07));border:2px solid rgba(0,180,197,.25);display:grid;place-items:center;font-family:var(--mono);font-size:1.5rem;font-weight:700;color:var(--text);cursor:grab;user-select:none;transition:all .2s;position:relative;box-shadow:var(--shadow-sm)}
.num-token:hover{transform:scale(1.12) rotate(-3deg);box-shadow:0 6px 20px rgba(0,180,197,.25);border-color:var(--cyan)}
.num-token.used{opacity:.2;pointer-events:none;filter:grayscale(.8)}
.num-token:active{cursor:grabbing}

@media(max-width:520px){
  .choices.grid2{grid-template-columns:1fr}
  .game-card{padding:22px 16px;margin:8px 12px}
}
</style>
</head>
<body>

<canvas id="cvs"></canvas>
<div class="nb nb1"></div>
<div class="nb nb2"></div>
<div class="nb nb3"></div>
<div class="toast-stack" id="toastStack"></div>

<!-- NAV -->
<nav>
  <div class="logo">CODEPLAY</div>
  <div class="nav-stars" id="navStars">
    <span class="star-icon" id="ns1"></span>
    <span class="star-icon" id="ns2"></span>
    <span class="star-icon" id="ns3"></span>
  </div>
  <button class="btn-back" onclick="location.href='2_3lesson.html'">Back</button>
</nav>

<!-- XP BAR -->
<div class="xp-bar-wrap">
  <span class="xp-label">⚡ XP</span>
  <div class="xp-track"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
  <span class="xp-count" id="xpCount">0 / 100</span>
</div>

<!-- STAGE DOTS -->
<div class="stage-row" id="stageDots"></div>

<!-- GAME CARD -->
<div class="game-card" id="gameCard"></div>

<!-- FINISH -->
<div class="finish-wrap" id="finishWrap">
  <div class="finish-trophy" id="fTrophy">🏆</div>
  <div class="star-big-row">
    <div class="star-big" id="fb1">⭐</div>
    <div class="star-big" id="fb2">⭐</div>
    <div class="star-big" id="fb3">⭐</div>
  </div>
  <div class="finish-title" id="fTitle">Amazing!</div>
  <div class="finish-msg" id="fMsg">You're a Numbers Master!</div>
  <div class="score-cards">
    <div class="sc"><div class="sc-num" id="fXp" style="color:var(--gold)">0</div><div class="sc-lbl">⚡ XP Earned</div></div>
    <div class="sc"><div class="sc-num" id="fRight" style="color:var(--green)">0</div><div class="sc-lbl">✅ Correct</div></div>
    <div class="sc"><div class="sc-num" id="fTotal" style="color:var(--cyan)">0/6</div><div class="sc-lbl">🎯 Levels</div></div>
  </div>
  <button class="btn-finish" onclick="goNext()">Next Lesson!</button>
  <button class="btn-play-again" onclick="restart()">↺ Play Again</button>
</div>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="si">⚡ <span class="sv" id="sbXp" style="color:var(--gold)">0</span> XP</div>
  <div class="si">✅ <span class="sv" id="sbRight" style="color:var(--green)">0</span> Right</div>
  <div class="si">❤️ <span class="sv" id="sbLives" style="color:var(--red)">3</span> Lives</div>
  <div class="si">🎮 Level <span class="sv" id="sbLevel" style="color:var(--cyan)">1</span></div>
</div>

<script>
/* STARFIELD — light pastel particles */
const cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d');let st=[];
function rsz(){
  cvs.width=innerWidth;cvs.height=innerHeight;
  st=Array.from({length:120},()=>({
    x:Math.random()*cvs.width,y:Math.random()*cvs.height,
    r:Math.random()*2+.5,
    a:Math.random()*.5+.1,
    da:(Math.random()-.5)*.006,
    sp:Math.random()*.06+.02,
    hue:Math.random()>0.5?180:260   // teal or purple
  }));
}
window.addEventListener('resize',rsz);rsz();
(function loop(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  st.forEach(s=>{
    s.a=Math.max(.05,Math.min(.6,s.a+s.da));
    if(s.a<=.05||s.a>=.6)s.da*=-1;
    s.y-=s.sp;
    if(s.y<0){s.y=cvs.height;s.x=Math.random()*cvs.width}
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`hsla(${s.hue},70%,55%,${s.a})`;ctx.fill();
  });
  requestAnimationFrame(loop);
})();

/* GAME STATE */
const TOTAL_XP=100;
let cur=0,xp=0,lives=3,right=0,answered=false;
let dragState={};

/* LEVELS */
const LEVELS=[
  {
    type:'choice',robo:'🤖',
    bubble:'Which one stores a NUMBER? 🔢',
    sub:'Numbers have NO quote marks around them!',
    grid:2,xp:15,
    choices:[
      {emoji:'📦',code:'age = "12"',ok:false},
      {emoji:'📦',code:'age = 12',ok:true},
      {emoji:'📦',code:'age = twelve',ok:false},
      {emoji:'📦',code:'"age" = 12',ok:false},
    ],
    okMsg:'🎉 Correct! No quotes = number variable! Great job!',
    badMsg:'💡 Numbers never need quotes. Just write the number directly!'
  },
  {
    type:'match',robo:'🤖',
    bubble:'Match each variable to its number! 🔗',
    sub:'Tap a name on the LEFT, then tap its number on the RIGHT!',
    xp:20,
    code:`<span class="var">score= <span class="num">100   <span class="cm"># a game score</span>\n<span class="var">age</span>   = <span class="num">8</span>     <span class="cm"># 8 years old</span>\n<span class="var">lives</span> = <span class="num">3</span>     <span class="cm"># chances in a game</span>`,
    pairs:[
      {name:'score',emoji:'🎮',hint:'A game score',value:100},
      {name:'age',emoji:'🎂',hint:'8 years old',value:8},
      {name:'lives',emoji:'❤️',hint:'Chances in a game',value:3},
    ],
    okMsg:'🎉 Perfect matches! You know your variables!',
    badMsg:'💡 Read the hints under each name — they tell you the number!'
  },
  {
    type:'output',robo:'🤖',
    bubble:'What does Python print? 🖨️',
    sub:'Pick the answer that Python will show on screen!',
    code:`<span class="var">stars = <span class="num">7\n<span class="fn">print</span>(<span class="var">stars</span>)`,
    xp:15,
    outputs:['stars','"7"','7','0'],answer:'7',
    okMsg:'🎉 Python prints 7 — the NUMBER stored inside the stars box!',
    badMsg:'💡 Python shows the VALUE inside the variable, not the variable name!'
  },
  {
    type:'output',robo:'🤖',
    bubble:'What is inside the box? 📦',
    sub:'Look at the code — what value is stored in the variable?',
    code:`<span class="var">balloons= <span class="num">20\n<span class="fn">print</span>(<span class="var">balloons</span>)`,
    xp:15,
    outputs:['balloons','2','20','"20"'],answer:'20',
    okMsg:'🎉 The balloons box holds the number 20!',
    badMsg:'💡 Look at what number is after the = sign!'
  },
  {
    type:'choice',robo:'🐛',
    bubble:'Spot the bug! 🐛',
    sub:'One variable has a bug — it has QUOTES around a number. Which one?',
    grid:2,xp:20,
    choices:[
      {emoji:'🐛',code:'coins = 50',ok:false},
      {emoji:'🐛',code:'level = "4"',ok:true},
      {emoji:'🐛',code:'hearts = 3',ok:false},
      {emoji:'🐛',code:'speed = 10',ok:false},
    ],
    okMsg:'🎉 Found it! level = "4" has quotes — that makes 4 a word, not a number!',
    badMsg:'💡 Look for the one that has " " marks around a number!'
  },
  {
    type:'match',robo:'🚀',
    bubble:'One more match round! 🚀',
    sub:'Tap a name on the LEFT, then tap its number on the RIGHT!',
    xp:15,
    code:`<span class="var">players = <span class="num">2   <span class="cm"># a 2-player game</span>\n<span class="var">wheels</span>  = <span class="num">4</span>   <span class="cm"># a car has 4</span>\n<span class="var">fingers</span> = <span class="num">5</span>   <span class="cm"># one hand</span>`,
    pairs:[
      {name:'players',emoji:'👥',hint:'A 2-player game',value:2},
      {name:'wheels',emoji:'🚗',hint:'A car has 4 wheels',value:4},
      {name:'fingers',emoji:'🖐️',hint:'One hand = 5',value:5},
    ],
    okMsg:'🎉 All matched! You are a Python superstar! ⭐',
    badMsg:'💡 Read the hints — they tell you exactly which number fits!'
  },
];

/* INIT */
function buildStageDots(){
  const row=document.getElementById('stageDots');
  row.innerHTML='';
  LEVELS.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='stage-dot'+(i===cur?' active':i<cur?' done':'');
    d.id='sd'+i;
    if(i<cur)d.innerHTML='';
    else d.textContent=i+1;
    row.appendChild(d);
  });
}

function render(){
  answered=false;dragState={};
  buildStageDots();
  document.getElementById('sbLevel').textContent=cur+1;
  const L=LEVELS[cur];
  const card=document.getElementById('gameCard');
  card.style.display='';card.innerHTML='';

  const rw=document.createElement('div');rw.className='robo-wrap';
  const r=document.createElement('div');r.className='robo';r.id='robo';r.textContent=L.robo;
  rw.appendChild(r);card.appendChild(rw);

  const bub=document.createElement('div');bub.className='q-bubble';
  bub.innerHTML=`<div class="q-text">${L.bubble}</div>${L.sub?`<div class="q-sub">${L.sub}</div>`:''}`;
  card.appendChild(bub);

  if(L.code){
    const cs=document.createElement('div');cs.className='code-snip';
    cs.innerHTML=L.code.replace(/\n/g,'<br/>');card.appendChild(cs);
  }

  if(L.type==='choice')buildChoice(card,L);
  else if(L.type==='match')buildMatch(card,L);
  else if(L.type==='output')buildOutput(card,L);

  const fb=document.createElement('div');fb.className='feedback';fb.id='fb';card.appendChild(fb);
  const nb=document.createElement('button');nb.className='btn-next';nb.id='nbtn';
  nb.textContent=cur<LEVELS.length-1?'Next Level →':'🏁 Finish!';
  nb.onclick=nextLevel;card.appendChild(nb);
}

function buildChoice(card,L){
  const wrap=document.createElement('div');
  wrap.className=`choices${L.grid===2?' grid2':''}`;
  L.choices.forEach((c,i)=>{
    const btn=document.createElement('button');btn.className='choice-btn';
    btn.innerHTML=`<span class="choice-emoji">${c.emoji}</span><span class="choice-code">${c.code}</span>`;
    btn.onclick=()=>pickChoice(i,L);wrap.appendChild(btn);
  });
  card.appendChild(wrap);
}

function pickChoice(i,L){
  if(answered)return;answered=true;
  const btns=document.querySelectorAll('.choice-btn');
  const ok=L.choices[i].ok;
  btns.forEach((b,j)=>{
    if(L.choices[j].ok)b.classList.add('correct');
    else if(j===i)b.classList.add('wrong');
    else b.classList.add('dimmed');
    b.style.pointerEvents='none';
  });
  resolve(ok,L);
}

function buildMatch(card,L){
  let selName=null,matched=0;
  const total=L.pairs.length;
  const shuffledVals=[...L.pairs].sort(()=>Math.random()-.5);
  const wrap=document.createElement('div');wrap.className='match-wrap';

  const leftCol=document.createElement('div');leftCol.className='match-col';
  const ll=document.createElement('div');ll.className='match-col-lbl';ll.textContent='Variable 📦';
  leftCol.appendChild(ll);
  L.pairs.forEach(p=>{
    const card2=document.createElement('div');card2.className='match-card';card2.id='mn_'+p.name;card2.dataset.name=p.name;
    card2.innerHTML=`<span class="match-emoji">${p.emoji}</span><div class="match-name">${p.name}</div>${p.hint?`<div style="font-size:.72rem;color:var(--muted);margin-top:4px;font-weight:700">${p.hint}</div>`:''}`;
    card2.onclick=()=>{
      if(answered)return;
      document.querySelectorAll('.match-card[data-name]').forEach(c2=>{if(!c2.classList.contains('matched'))c2.classList.remove('selected')});
      card2.classList.add('selected');selName=p.name;
    };
    leftCol.appendChild(card2);
  });

  const rightCol=document.createElement('div');rightCol.className='match-col';
  const rl=document.createElement('div');rl.className='match-col-lbl';rl.textContent='Number 🔢';
  rightCol.appendChild(rl);
  shuffledVals.forEach(p=>{
    const card2=document.createElement('div');card2.className='match-card';card2.id='mv_'+p.value;card2.dataset.value=p.value;
    card2.innerHTML=`<div class="match-num">${p.value}</div>`;
    card2.onclick=()=>{
      if(answered||!selName)return;
      const correct=L.pairs.find(x=>x.name===selName).value;
      const nameCard=document.getElementById('mn_'+selName);
      if(p.value===correct){
        nameCard.classList.remove('selected');nameCard.classList.add('matched');card2.classList.add('matched');
        selName=null;matched++;confetti(30);
        if(matched===total){setTimeout(()=>resolve(true,L),350);}
      } else {
        nameCard.classList.add('wrong-flash');card2.classList.add('wrong-flash');
        setTimeout(()=>{nameCard.classList.remove('wrong-flash','selected');card2.classList.remove('wrong-flash');},450);
        selName=null;
      }
    };
    rightCol.appendChild(card2);
  });
  wrap.appendChild(leftCol);wrap.appendChild(rightCol);card.appendChild(wrap);
}

function buildOutput(card,L){
  const row=document.createElement('div');row.className='output-choices';
  L.outputs.forEach(o=>{
    const chip=document.createElement('div');chip.className='out-chip';chip.textContent=o;
    chip.onclick=()=>pickOutput(o,chip,L);row.appendChild(chip);
  });
  card.appendChild(row);
}

function pickOutput(val,chip,L){
  if(answered)return;answered=true;
  const ok=(val===L.answer);
  document.querySelectorAll('.out-chip').forEach(c=>{
    if(c.textContent===L.answer)c.classList.add('correct');
    else if(c===chip&&!ok)c.classList.add('wrong');
    else c.classList.add('dimmed');
    c.style.pointerEvents='none';
  });
  resolve(ok,L);
}

function resolve(ok,L){
  const robo=document.getElementById('robo');
  const fb=document.getElementById('fb');
  const nb=document.getElementById('nbtn');
  if(ok){
    robo.classList.add('happy');setTimeout(()=>robo.classList.remove('happy'),600);
    xp+=L.xp;right++;updateStats();confetti(60);
    fb.className='feedback ok show';
    fb.innerHTML=`<span class="fb-ico">🎉</span><span>${L.okMsg}</span>`;
    toast('good','⭐',`+${L.xp} XP!`,2500);
    if(right===2)document.getElementById('ns1').classList.add('lit');
    if(right===4)document.getElementById('ns2').classList.add('lit');
    if(right===6)document.getElementById('ns3').classList.add('lit');
  } else {
    robo.classList.add('sad');setTimeout(()=>robo.classList.remove('sad'),500);
    lives=Math.max(0,lives-1);updateStats();
    fb.className='feedback bad show';
    fb.innerHTML=`<span class="fb-ico">💡</span><span>${L.badMsg}</span>`;
  }
  nb.className='btn-next show';
  nb.textContent=cur<LEVELS.length-1?'Next Level →':'🏁 Finish!';
}

function nextLevel(){
  cur++;if(cur>=LEVELS.length){finish();return;}
  document.getElementById('gameCard').innerHTML='';render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateStats(){
  document.getElementById('sbXp').textContent=xp;
  document.getElementById('sbRight').textContent=right;
  document.getElementById('sbLives').textContent=lives;
  const pct=Math.min((xp/TOTAL_XP)*100,100);
  document.getElementById('xpFill').style.width=pct+'%';
  document.getElementById('xpCount').textContent=`${xp} / ${TOTAL_XP}`;
}

function finish(){
  document.getElementById('gameCard').style.display='none';
  const fw=document.getElementById('finishWrap');fw.classList.add('show');
  const pct=Math.round((right/LEVELS.length)*100);
  const trophies=['🥉','🥈','🏆'];
  const trophy=pct>=90?trophies[2]:pct>=60?trophies[1]:trophies[0];
  const titles=['Keep Practising!','Well Done! 🎉','YOU\'RE A STAR! ⭐'];
  const msgs=['Watch the lesson again and try once more — you\'ve got this!',
              'Great job! You understand number variables really well!',
              'WOW! Perfect score! You\'re a Numbers Master! 🔢🚀'];
  const tier=pct>=90?2:pct>=60?1:0;
  document.getElementById('fTrophy').textContent=trophy;
  document.getElementById('fTitle').textContent=titles[tier];
  document.getElementById('fMsg').textContent=msgs[tier];
  document.getElementById('fXp').textContent=xp;
  document.getElementById('fRight').textContent=right;
  document.getElementById('fTotal').textContent=`${right}/${LEVELS.length}`;
  setTimeout(()=>{
    if(pct>=30)document.getElementById('fb1').classList.add('lit');
    setTimeout(()=>{if(pct>=60)document.getElementById('fb2').classList.add('lit');},350);
    setTimeout(()=>{if(pct>=90)document.getElementById('fb3').classList.add('lit');},700);
  },500);
  localStorage.setItem('lesson03_p2_game','done');
  localStorage.setItem('part2_progress','5');
  confetti(120);
  setTimeout(()=>toast('gold','🏆',`Game Over! ${xp} XP earned!`,6000),600);
}

function goNext(){location.href='quest2.html';}

function restart(){
  cur=0;xp=0;lives=3;right=0;answered=false;dragState={};updateStats();
  document.getElementById('gameCard').style.display='';
  document.getElementById('finishWrap').classList.remove('show');
  ['ns1','ns2','ns3'].forEach(id=>document.getElementById(id).classList.remove('lit'));
  render();window.scrollTo({top:0,behavior:'smooth'});
}

/* TOAST */
let _tid=0;
function toast(type,ico,msg,dur=4000){
  const stack=document.getElementById('toastStack'),id=++_tid;
  const el=document.createElement('div');el.className=`toast ${type}`;el.id='tn'+id;
  el.innerHTML=`<span style="font-size:1.3rem">${ico}</span><span>${msg}</span>`;
  stack.appendChild(el);
  setTimeout(()=>{if(el.parentNode){el.classList.add('leaving');setTimeout(()=>el.remove(),320);}},dur);
}

/* CONFETTI — light, vibrant palette */
const CF=['#00b4c5','#7c52e8','#e8900a','#e83d5c','#00b87a','#00d4c0','#ff9f5e'];
function confetti(n){
  for(let i=0;i<n;i++)setTimeout(()=>{
    const el=document.createElement('div'),s=6+Math.random()*10;
    el.className='cf';
    el.style.cssText=`left:${Math.random()*100}vw;top:-12px;width:${s}px;height:${s*(Math.random()>.5?1:.4)}px;background:${CF[0|Math.random()*CF.length]};border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${1.5+Math.random()*1.8}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),3500);
  },i*16);
}

/* START */
render();
</script>
</body>
</html>
