<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CODEPLAY — Pip's Cosmic Post Office 📮</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Share+Tech+Mono&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#e8f6f5;
  --surface:rgba(255,255,255,0.76);
  --surface2:rgba(255,255,255,0.93);
  --border:rgba(255,255,255,0.85);
  --border2:rgba(12,191,181,0.25);

  --cyan:#00b8aa;
  --teal:#0cbfb5;
  --teal2:#00a3b4;
  --teal-soft:#c5f0ec;
  --purple:#7c5cbf;
  --purple-soft:#e9e2f8;
  --pink:#d4567a;
  --pink-soft:#fce4ec;
  --gold:#c8960a;
  --gold-soft:#fff3cc;
  --green:#1a9e6a;
  --green-soft:#d1f5e8;
  --red:#d0394f;
  --red-soft:#fde8ec;
  --orange:#d4620a;
  --orange-soft:#fdecd6;

  --text:#1a2e35;
  --text2:#2d4a54;
  --muted:#6b8e96;
  --muted2:rgba(107,142,150,0.5);
  --paper:#fffef5;
  --ink:#1a1a2e;

  --mono:'Share Tech Mono',monospace;
  --body:'Plus Jakarta Sans','Nunito',sans-serif;
  --hand:'Caveat',cursive;

  --shadow-sm:0 1px 4px rgba(0,100,120,0.08),0 1px 2px rgba(0,100,120,0.05);
  --shadow-md:0 4px 18px rgba(0,100,120,0.1),0 2px 6px rgba(0,100,120,0.07);
  --shadow-lg:0 10px 36px rgba(0,100,120,0.13),0 4px 12px rgba(0,100,120,0.08);
  --glow-teal:0 0 18px rgba(12,191,181,0.28);
  --glow-purple:0 0 16px rgba(124,92,191,0.22);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column}

/* ── BACKGROUND ── */
.bg-mesh{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 8% 0%,rgba(100,225,230,0.3),transparent 58%),
    radial-gradient(ellipse 60% 70% at 92% 8%,rgba(150,195,245,0.22),transparent 55%),
    radial-gradient(ellipse 70% 50% at 50% 100%,rgba(180,155,240,0.18),transparent 58%),
    radial-gradient(ellipse 50% 55% at 80% 65%,rgba(90,230,210,0.15),transparent 55%),
    linear-gradient(155deg,#dff7f5 0%,#e8f0fb 38%,#f0e8f8 68%,#e0f5f2 100%);
  animation:meshShift 22s ease-in-out infinite alternate;
}
@keyframes meshShift{0%{filter:hue-rotate(0deg) brightness(1)}50%{filter:hue-rotate(7deg) brightness(1.02)}100%{filter:hue-rotate(-4deg) brightness(0.99)}}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(65px)}
.ob1{width:520px;height:520px;top:-160px;left:-110px;background:radial-gradient(circle,rgba(12,191,181,0.2),transparent 65%);animation:ob1 28s ease-in-out infinite alternate}
.ob2{width:420px;height:420px;bottom:-110px;right:-90px;background:radial-gradient(circle,rgba(124,92,191,0.16),transparent 65%);animation:ob2 23s ease-in-out infinite alternate-reverse}
.ob3{width:320px;height:320px;top:42%;left:58%;background:radial-gradient(circle,rgba(212,86,122,0.1),transparent 65%);animation:ob3 19s ease-in-out infinite alternate}
@keyframes ob1{to{transform:translate(28px,18px)scale(1.08)}}
@keyframes ob2{to{transform:translate(-22px,16px)scale(1.06)}}
@keyframes ob3{to{transform:translate(-18px,-12px)scale(1.1)}}
.sparkle-field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sp{position:absolute;border-radius:50%;animation:spFloat var(--dur,8s) ease-in-out infinite var(--delay,0s)}
@keyframes spFloat{0%,100%{transform:translateY(0) scale(1);opacity:var(--op,0.35)}50%{transform:translateY(-13px) scale(1.2);opacity:calc(var(--op,0.35)*1.7)}}

/* keyframes */
@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.74)}60%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes bigBounce{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}70%{transform:scale(.97)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes spinR{to{transform:rotate(360deg)}}
@keyframes shine{to{left:160%}}
@keyframes pulseTeal{0%,100%{box-shadow:0 0 0 0 rgba(12,191,181,0.5)}70%{box-shadow:0 0 0 10px rgba(12,191,181,0)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-11deg)}75%{transform:rotate(11deg)}}
@keyframes stampDown{0%{transform:translateY(-30px) scale(1.2);opacity:.3}60%{transform:translateY(4px) scale(.95)}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes pcSlide{0%{transform:translateX(60px) rotate(3deg);opacity:0}70%{transform:translateX(-4px) rotate(-.5deg)}100%{transform:translateX(0) rotate(0);opacity:1}}
@keyframes ink-write{from{width:0}to{width:100%}}
@keyframes blenderSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes zapFlash{0%,100%{opacity:0}30%,70%{opacity:1}50%{opacity:.5}}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes machineHum{0%,100%{box-shadow:0 0 14px rgba(124,92,191,0.2)}50%{box-shadow:0 0 28px rgba(124,92,191,0.45),0 0 56px rgba(124,92,191,0.12)}}
@keyframes confettiFall{to{transform:translateY(110vh)rotate(720deg);opacity:0}}
@keyframes starPop{0%{transform:scale(0)rotate(-30deg);opacity:1}100%{transform:scale(2.4)rotate(15deg);opacity:0}}
@keyframes glitch{0%,100%{clip-path:inset(0)}20%{clip-path:inset(30% 0 40% 0);transform:translate(-2px,0)}40%{clip-path:inset(60% 0 10% 0);transform:translate(2px,0)}60%{clip-path:inset(10% 0 70% 0);transform:translate(-1px,0)}}
@keyframes cursorBlink{0%,100%{border-color:rgba(0,0,0,.3)}50%{border-color:transparent}}


/* ── SHELL ── */
.shell{position:relative;z-index:2;max-width:600px;width:100%;margin:0 auto;padding:16px 14px 84px}

/* ── HEADER ── */
.game-header{text-align:center;margin-bottom:14px;animation:fadeUp .5s ease both}
.eyebrow{display:inline-flex;align-items:center;gap:7px;border:1.5px solid rgba(12,191,181,0.35);background:rgba(12,191,181,0.08);padding:4px 15px;border-radius:99px;font-size:.67rem;letter-spacing:.18em;color:var(--teal);text-transform:uppercase;margin-bottom:9px;font-weight:800}
.eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:blink 1.2s infinite}
.game-title{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:900;color:var(--text);margin-bottom:6px;line-height:1.1;letter-spacing:-.02em}
.hl{background:linear-gradient(135deg,var(--teal) 0%,var(--purple) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.game-sub{font-size:.86rem;color:var(--muted);line-height:1.55;font-weight:600;max-width:400px;margin:0 auto}

/* ── SCOREBOARD ── */
.scoreboard{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.spill{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:99px;padding:6px 13px;font-size:.82rem;font-weight:800;color:var(--text2);box-shadow:var(--shadow-sm)}
.spill .v{font-family:var(--mono);font-size:.82rem}

/* ── STAGE BAR ── */
.stage-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.stage-name{font-size:.66rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.stage-dots{display:flex;gap:6px}
.dot{width:24px;height:6px;border-radius:99px;background:rgba(12,191,181,0.14);transition:all .4s}
.dot.done{background:var(--green);box-shadow:0 0 7px rgba(26,158,106,0.5)}
.dot.active{background:var(--teal);box-shadow:0 0 9px rgba(12,191,181,0.7);animation:pulseTeal 1.4s infinite}

/* ── ARENA ── */
.arena{border-radius:18px;border:1.5px solid var(--border);background:var(--surface);backdrop-filter:blur(18px);padding:18px 16px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:var(--shadow-md);animation:pop .4s ease both}
.arena::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:99px 99px 0 0;background:linear-gradient(90deg,transparent,var(--teal),var(--purple),transparent)}

/* PLANET BAR */
.planet-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 12px;background:rgba(12,191,181,0.06);border:1.5px solid rgba(12,191,181,0.18);border-radius:11px}
.planet-emoji{font-size:1.8rem;animation:wiggle 3s ease-in-out infinite}
.planet-name{font-size:.88rem;font-weight:800;color:var(--text)}
.planet-sub{font-size:.68rem;color:var(--muted);font-weight:600}

/* ══ STAGE 1: STAMP PRESS ══ */
.var-box-display{background:rgba(240,248,255,0.85);border:1.5px solid rgba(212,98,10,0.25);border-radius:11px;padding:10px 20px;font-family:var(--mono);font-size:.9rem;text-align:center;color:var(--orange);font-weight:800;min-width:180px}
.var-box-display .eq{color:var(--muted2);margin:0 6px}
.var-box-display .val{color:var(--gold)}
.print-btn{padding:14px 32px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--teal),var(--purple));color:#fff;font-size:.98rem;font-weight:900;cursor:pointer;transition:all .22s;letter-spacing:.03em;font-family:var(--body);position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(12,191,181,0.3)}
.print-btn::after{content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 1.8s linear infinite}
.print-btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 10px 28px rgba(12,191,181,0.4)}
.print-btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
.stamp-machine{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px}
.press-code{font-family:var(--mono);font-size:.86rem;background:rgba(240,248,255,0.85);border:1.5px solid rgba(12,191,181,0.2);border-radius:8px;padding:8px 14px;color:var(--teal);text-align:center}
.press-code .fn{color:var(--teal)}.press-code .var{color:var(--orange)}.press-code .str{color:var(--gold)}

/* POSTCARD OUTPUT */
.postcard-output{background:var(--paper);border-radius:12px;padding:0;color:var(--ink);position:relative;overflow:hidden;box-shadow:var(--shadow-lg),0 1px 0 rgba(255,255,255,.8) inset;display:none;animation:pcSlide .5s ease both;margin-bottom:14px;font-family:'Segoe UI',sans-serif;font-style:normal}
.postcard-output.show{display:block}
.pc-body{display:flex}
.pc-left{padding:12px 14px;flex:1;border-right:1px dashed rgba(80,70,60,.2)}
.pc-from{font-family:var(--hand);font-size:.65rem;color:rgba(80,70,60,.4);margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase}
.pc-msg{font-family:var(--hand);font-size:1.4rem;color:#1a1020;line-height:1.4;min-height:36px;overflow:hidden;white-space:nowrap}
.pc-msg .ink{display:inline-block;overflow:hidden;border-right:2px solid rgba(0,0,0,.3);white-space:nowrap;animation:ink-write .6s steps(30,end) .2s both,cursorBlink .5s step-end 4}
.pc-right{width:70px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px}
.pc-stamp-sticker{width:46px;height:58px;background:linear-gradient(135deg,var(--teal),var(--purple));border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.3rem;color:white;border:1px solid rgba(0,0,0,.1);position:relative}
.pc-stamp-sticker::before{content:'CODEPLAY';position:absolute;bottom:3px;font-family:var(--body);font-size:.28rem;font-weight:900;letter-spacing:.08em;color:rgba(255,255,255,.65)}
.pc-postmark{width:44px;height:44px;border-radius:50%;border:2px solid rgba(80,60,50,.15);display:flex;align-items:center;justify-content:center;font-size:.28rem;font-weight:900;color:rgba(80,60,50,.4);text-align:center;letter-spacing:.05em;text-transform:uppercase;writing-mode:vertical-lr;text-orientation:mixed;line-height:1.3}

/* POSTCARD CHOICES */
.pc-choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pc-choice{background:var(--paper);border-radius:10px;border:2px solid rgba(200,185,155,.2);color:var(--ink);cursor:pointer;transition:all .22s;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);animation:fadeUp .3s ease both}
.pc-choice:hover{border-color:rgba(12,191,181,0.5);transform:translateY(-4px) scale(1.02);box-shadow:var(--shadow-md)}
.pc-choice.ok{border-color:var(--green)!important;background:var(--green-soft)!important;box-shadow:0 0 18px rgba(26,158,106,0.28)!important;animation:bigBounce .4s ease!important}
.pc-choice.bad{border-color:var(--red)!important;animation:shake .4s ease!important}
.pc-choice.off{pointer-events:none;opacity:.42}
.pc-choice.reveal{border-color:rgba(26,158,106,0.5)!important;background:rgba(26,158,106,0.06)!important}
.pcc-inner{padding:10px 12px}
.pcc-stamp{position:absolute;top:5px;right:5px;width:24px;height:30px;background:linear-gradient(135deg,var(--teal),var(--purple));border-radius:3px;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.pcc-text{font-family:'Segoe UI',sans-serif;font-size:1rem;color:var(--ink);padding-right:28px;min-height:28px;line-height:1.35}
.pcc-lines{height:14px;background:repeating-linear-gradient(transparent,transparent 6px,rgba(100,90,80,.1) 6px,rgba(100,90,80,.1) 7px);margin-top:7px;border-radius:2px}

/* ══ STAGE 2: MESSAGE MIXER ══ */
.customer-order{background:rgba(12,191,181,0.07);border:1.5px solid rgba(12,191,181,0.2);border-radius:12px;padding:10px 14px;margin-bottom:12px;text-align:center}
.order-label{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:5px}
.order-text{font-family:var(--hand);font-size:1.3rem;font-weight:600;color:var(--green)}
.ingredient-shelf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.ingredient{border-radius:11px;padding:9px 15px;font-family:var(--mono);font-size:.82rem;font-weight:900;cursor:pointer;transition:all .22s;user-select:none;border:2px solid transparent;position:relative}
.ingredient.text-type{background:var(--gold-soft);border-color:rgba(200,150,10,0.35);color:var(--gold)}
.ingredient.var-type{background:var(--orange-soft);border-color:rgba(212,98,10,0.3);color:var(--orange)}
.ingredient.fn-type{background:var(--purple-soft);border-color:rgba(124,92,191,0.3);color:var(--purple)}
.ingredient.op-type{background:rgba(107,142,150,0.1);border-color:rgba(107,142,150,0.25);color:var(--muted);font-size:1.1rem}
.ingredient:hover{transform:translateY(-4px) scale(1.06);box-shadow:var(--shadow-md)}
.ingredient.used{opacity:.2;pointer-events:none;text-decoration:line-through}
.mixer-bowl{background:rgba(240,248,255,0.8);border:1.5px dashed rgba(12,191,181,0.4);border-radius:13px;min-height:50px;padding:10px 14px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:9px;transition:border-color .3s}
.mixer-bowl.ready{border-color:var(--teal);border-style:solid;background:rgba(12,191,181,0.06)}
.mixer-bowl.error-shake{animation:shake .4s ease}
.mix-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:7px;font-family:var(--mono);font-size:.78rem;font-weight:800;animation:pop .2s ease both}
.mix-chip.t{background:var(--gold-soft);border:1.5px solid rgba(200,150,10,0.3);color:var(--gold)}
.mix-chip.v{background:var(--orange-soft);border:1.5px solid rgba(212,98,10,0.25);color:var(--orange)}
.mix-chip.f{background:var(--purple-soft);border:1.5px solid rgba(124,92,191,0.3);color:var(--purple)}
.mix-chip.o{background:rgba(107,142,150,0.1);border:1.5px solid rgba(107,142,150,0.22);color:var(--muted)}
.mix-chip .rm{cursor:pointer;color:rgba(208,57,79,.5);margin-left:3px;font-size:.75rem;transition:color .15s}
.mix-chip .rm:hover{color:var(--red)}
.bowl-placeholder{color:var(--muted2);font-size:.8rem;font-style:italic}
.blend-btn{width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--teal),var(--purple));color:#fff;font-size:.9rem;font-weight:900;cursor:pointer;transition:all .22s;font-family:var(--body);display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(12,191,181,0.28)}
.blend-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(12,191,181,0.4)}
.blend-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.blender-anim{display:none;justify-content:center;align-items:center;gap:10px;padding:14px;background:rgba(12,191,181,0.06);border:1.5px solid rgba(12,191,181,0.2);border-radius:12px;margin-bottom:10px}
.blender-anim.show{display:flex;animation:fadeUp .3s ease both}
.blender-jar{font-size:2.2rem;animation:blenderSpin .4s linear infinite}
.blending-text{font-family:var(--mono);font-size:.82rem;color:var(--teal);font-weight:800}

/* ══ STAGE 3: BUG ZAPPER ══ */
.broken-terminal{background:rgba(255,240,242,0.9);border:1.5px solid rgba(208,57,79,0.35);border-radius:12px;padding:12px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.broken-terminal::before{content:'⚠ ERROR';position:absolute;top:6px;right:10px;font-size:.5rem;color:rgba(208,57,79,.5);letter-spacing:.15em;font-weight:900}
.broken-terminal .broken-code{font-family:var(--mono);font-size:.9rem;color:var(--red);font-weight:800;animation:glitch 2s infinite}
.broken-terminal .error-msg{font-size:.74rem;color:rgba(208,57,79,.55);margin-top:6px;font-family:var(--mono)}
.alien-bubble{display:flex;align-items:flex-start;gap:10px;background:rgba(12,191,181,0.06);border:1.5px solid rgba(12,191,181,0.18);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.bubble-alien{font-size:2rem;flex-shrink:0;animation:wiggle 3s ease-in-out infinite}
.bubble-text{font-size:.84rem;font-weight:700;color:var(--text2);line-height:1.55}
.bubble-text b{color:var(--teal);font-weight:800}
.fix-choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fix-opt{padding:11px 10px;border-radius:11px;border:1.5px solid rgba(12,191,181,0.2);background:rgba(255,255,255,0.68);font-family:var(--mono);font-size:.8rem;color:var(--text2);cursor:pointer;transition:all .22s;font-weight:800;text-align:center;min-height:46px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.fix-opt:hover{border-color:var(--teal);background:rgba(12,191,181,0.08);color:var(--teal);transform:translateY(-3px);box-shadow:var(--shadow-md)}
.fix-opt.ok{border-color:var(--green)!important;background:var(--green-soft)!important;color:var(--green)!important;box-shadow:0 0 16px rgba(26,158,106,0.28)!important;animation:bigBounce .4s ease;pointer-events:none}
.fix-opt.bad{border-color:var(--red)!important;background:var(--red-soft)!important;color:var(--red)!important;animation:shake .4s ease;pointer-events:none}
.fix-opt.reveal{border-color:rgba(26,158,106,0.5)!important;background:rgba(26,158,106,0.07)!important;color:var(--green)!important}
.fix-opt.off{pointer-events:none;opacity:.38}
.zap-overlay{display:none;position:absolute;inset:0;background:rgba(200,150,10,.07);border-radius:10px;justify-content:center;align-items:center;font-size:3rem;z-index:10;pointer-events:none;animation:zapFlash .5s ease}
.zap-overlay.show{display:flex}

/* ══ STAGE 4: STR() TRANSFORMER ══ */
.type-explainer{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.type-block{display:flex;flex-direction:column;align-items:center;gap:5px}
.type-box{width:70px;height:70px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:900;font-family:var(--mono)}
.type-box.num{background:var(--green-soft);border:2px solid rgba(26,158,106,0.4);color:var(--green)}
.type-box.txt{background:var(--gold-soft);border:2px solid rgba(200,150,10,0.4);color:var(--gold)}

.str-machine-emoji{font-size:1.4rem}

.str-opt{padding:12px 10px;border-radius:12px;border:1.5px solid rgba(12,191,181,0.18);background:rgba(255,255,255,0.68);font-family:var(--mono);font-size:.8rem;color:var(--text2);cursor:pointer;transition:all .22s;font-weight:800;text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center;line-height:1.4;box-shadow:var(--shadow-sm)}

.str-opt.ok{border-color:var(--green)!important;background:var(--green-soft)!important;color:var(--green)!important;box-shadow:0 0 16px rgba(26,158,106,0.28)!important;animation:bigBounce .4s ease;pointer-events:none}
.str-opt.bad{border-color:var(--red)!important;background:var(--red-soft)!important;color:var(--red)!important;animation:shake .4s ease;pointer-events:none}
.str-opt.reveal{border-color:rgba(26,158,106,0.5)!important;background:rgba(26,158,106,0.07)!important;color:var(--green)!important}
.str-opt.off{pointer-events:none;opacity:.38}

/* HINT */
.hint{background:rgba(200,150,10,0.06);border:1px solid rgba(200,150,10,0.2);border-radius:9px;padding:8px 13px;font-size:.78rem;line-height:1.55;color:var(--muted);margin-bottom:11px;font-weight:600}

/* CODE DISPLAY */
.code-display{background:rgba(240,248,255,0.85);border:1.5px solid rgba(12,191,181,0.18);border-radius:11px;padding:11px 15px;margin-bottom:12px;font-family:var(--mono);font-size:.85rem;line-height:1.9;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.code-display::after{content:'🐍 python';position:absolute;top:7px;right:11px;font-size:.48rem;color:rgba(12,191,181,0.4);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.cl-var{color:var(--orange);font-weight:700}.cl-str{color:var(--gold);font-weight:800}.cl-num{color:var(--green);font-weight:800}.cl-fn{color:var(--teal);font-weight:800}.cl-op{color:var(--muted2)}

/* NEXT BUTTON */
.nextwrap{display:flex;justify-content:center;margin-top:4px}
.bnext{padding:12px 40px;border-radius:13px;border:none;background:linear-gradient(135deg,var(--teal),var(--purple));color:#fff;font-size:.92rem;font-weight:900;cursor:pointer;transition:all .22s;position:relative;overflow:hidden;display:none;align-items:center;gap:8px;font-family:var(--body);box-shadow:0 5px 18px rgba(12,191,181,0.3)}

.result{display:none;text-align:center;padding:26px 10px 0;animation:fadeUp .5s ease both}
.result.show{display:block}
.r-trophy{font-size:5rem;display:block;margin-bottom:10px;animation:float 3s ease-in-out infinite}

.r-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.btn-replay{padding:11px 24px;border-radius:12px;border:1.5px solid rgba(124,92,191,0.3);background:var(--purple-soft);color:var(--purple);font-size:.86rem;font-weight:800;cursor:pointer;transition:all .22s;font-family:var(--body)}

.btn-next:hover{transform:translateY(-2px);box-shadow:0 7px 22px rgba(12,191,181,0.4)}

/* TOAST */
.toast{position:fixed;bottom:62px;left:50%;transform:translateX(-50%) translateY(20px);z-index:999;padding:11px 22px;border-radius:14px;font-weight:800;font-size:.86rem;opacity:0;transition:all .3s;pointer-events:none;backdrop-filter:blur(16px);white-space:nowrap;max-width:92vw;text-align:center;font-family:var(--body)}

.star-pop{position:fixed;font-size:1.5rem;pointer-events:none;z-index:999;animation:starPop .65s ease both}

/* STATS BAR */
.stats-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;height:48px;background:rgba(255,255,255,0.9);backdrop-filter:blur(18px);border-top:1px solid rgba(12,191,181,0.16);box-shadow:0 -1px 14px rgba(0,100,120,0.07);display:flex;align-items:center;justify-content:center;gap:28px}

@media(max-width:480px){.fix-choices,.str-choices,.pc-choices{grid-template-columns:1fr}.stats-bar{gap:14px}}
</style>

<body>

<script>
/* ── SPARKLES ── */
(function(){
  const field=document.getElementById('sparkles');
  const colors=['rgba(12,191,181,','rgba(124,92,191,','rgba(212,86,122,','rgba(200,150,10,','rgba(26,158,106,'];
  for(let i=0;i<28;i++){
    const el=document.createElement('div');el.className='sp';
    const c=colors[Math.floor(Math.random()*colors.length)];
    const op=(0.13+Math.random()*0.27).toFixed(2);
    const size=3+Math.random()*5;
    el.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;background:${c}${op});--dur:${6+Math.random()*9}s;--delay:${Math.random()*6}s;--op:${op};filter:blur(${Math.random()>.5?'1px':'0px'})`;
    field.appendChild(el);
  }
})();

/* ── STATE ── */
let xp=0,lives=3,streak=0,hits=0,stage=0;
const TOTAL=4;

/* ════════ DATA ════════ */
const S1=[
  {planet:'🪐',planetName:'Planet Zeta',planetSub:'Home of the Zorbians',varName:'name',varVal:'"Zorp"',type:'str',code:`<span class="cl-var">name</span> <span class="cl-op">=</span> <span class="cl-str">"Zorp"</span>\n<span class="cl-fn">print</span>(<span class="cl-var">name</span>)`,answer:'Zorp',choices:['Zorp','"Zorp"','name','print(name)'],message:'📮 Yes! print(name) prints the VALUE — Zorp — not the word "name" or quotes!'},
  {planet:'🌙',planetName:'Moon Station 9',planetSub:'Home of the Blipbots',varName:'greeting',varVal:'"Hi there!"',type:'str',code:`<span class="cl-var">greeting</span> <span class="cl-op">=</span> <span class="cl-str">"Hi there!"</span>\n<span class="cl-fn">print</span>(<span class="cl-var">greeting</span>)`,answer:'Hi there!',choices:['greeting','"Hi there!"','Hi there!','print("Hi there!")'],message:'💌 Brilliant! No quotes in the output — print() shows just the text value!'},
  {planet:'🌠',planetName:'Nebula Cloud',planetSub:'Home of the Novas',varName:'score',varVal:'99',type:'num',code:`<span class="cl-var">score</span> <span class="cl-op">=</span> <span class="cl-num">99</span>\n<span class="cl-fn">print</span>(<span class="cl-var">score</span>)`,answer:'99',choices:['score','"99"','99','print(99)'],message:'🎮 Amazing! print(score) prints the number 99 — the value stored inside!'},
  {planet:'🛸',planetName:'Asteroid Base',planetSub:'Home of the Rexxis',varName:'name',varVal:'"Rexxi"',type:'str',code:`<span class="cl-var">name</span> <span class="cl-op">=</span> <span class="cl-str">"Rexxi"</span>\n<span class="cl-fn">print</span>(<span class="cl-str">"Hello, "</span> <span class="cl-op">+</span> <span class="cl-var">name</span>)`,answer:'Hello, Rexxi',choices:['Hello, name','"Hello, Rexxi"','Hello, Rexxi','Hello, "Rexxi"'],message:'🚀 Superstar! The + glues "Hello, " and "Rexxi" together into one message!'},
];

const S2=[
  {planet:'🌍',planetName:'Earth Station',planetSub:'Alien pen pal programme',varDef:`name = "Blip"`,varDisplay:`<span class="cl-var">name</span> <span class="cl-op">=</span> <span class="cl-str">"Blip"</span>`,targetOutput:'Hello, Blip!',ingredients:[{label:'print(',type:'f'},{label:'"Hello, "',type:'t'},{label:'+',type:'o'},{label:'name',type:'v'},{label:'+"!"',type:'o'},{label:')',type:'f'},{label:'"name"',type:'t'},{label:'-',type:'o'}],correctOrder:['print(','"Hello, "','+','name','+"!"',')'],message:'🎉 "Hello, " + name + "!" — the + glue joins them all into one message!'},
  {planet:'🪐',planetName:'Planet Zeta',planetSub:'Returning from last visit',varDef:`pet = "Stardust"`,varDisplay:`<span class="cl-var">pet</span> <span class="cl-op">=</span> <span class="cl-str">"Stardust"</span>`,targetOutput:'My pet: Stardust',ingredients:[{label:'print(',type:'f'},{label:'"My pet: "',type:'t'},{label:'+',type:'o'},{label:'pet',type:'v'},{label:')',type:'f'},{label:'"pet"',type:'t'},{label:'*',type:'o'}],correctOrder:['print(','"My pet: "','+','pet',')'],message:'🐾 pet is a variable — no quotes needed! The + joins the text and its value!'},
  {planet:'🌌',planetName:'Galaxy Core',planetSub:'Home of the Sages',varDef:`planet = "Zeta"`,varDisplay:`<span class="cl-var">planet</span> <span class="cl-op">=</span> <span class="cl-str">"Zeta"</span>`,targetOutput:'I live on Zeta',ingredients:[{label:'print(',type:'f'},{label:'"I live on "',type:'t'},{label:'+',type:'o'},{label:'planet',type:'v'},{label:')',type:'f'},{label:'"planet"',type:'t'},{label:'-',type:'o'}],correctOrder:['print(','"I live on "','+','planet',')'],message:'🌌 You\'re a natural! "I live on " + planet joins to make "I live on Zeta"!'},
];

const S3=[
  {planet:'🛸',planetName:'Asteroid Base',planetSub:'Emergency repair call!',alien:'😬',alienName:'Rexxi',story:'I asked for my name but got the word <b>"name"</b> instead of <b>Rexxi</b>! My postcard says the wrong thing!',broken:'print("name")',wanted:'Rexxi',choices:['print(name)','Print(name)','print name','print("Rexxi")'],answer:0,message:'✅ No quotes around a variable! print("name") prints the word "name". print(name) prints the VALUE!'},
  {planet:'🌙',planetName:'Moon Station 9',planetSub:'System jam detected',alien:'🤖',alienName:'Blip',story:'The postcard came out half-blank! It printed <b>"Hello"</b> but forgot to glue on my name!',broken:'print("Hello" name)',wanted:'Hello Blip',choices:['print("Hello " + name)','print(Hello + name)','print("Hello" , name)','print "Hello" name'],answer:0,message:'✅ The + sign is the glue! Without it Python doesn\'t know to join "Hello " and name!'},
  {planet:'🪐',planetName:'Planet Zeta',planetSub:'TypeError emergency!',alien:'👾',alienName:'Zorp',story:'I tried to print my age in a message but Python threw a <b>TypeError</b>! Numbers and text can\'t mix without help!',broken:'print("Age: " + age)',wanted:'Age: 7',choices:['print("Age: " + str(age))','print(str("Age: ") + age)','print("Age: " * age)','print("Age: " + "age")'],answer:0,message:'✅ Numbers need str() before they can join text! str(age) converts the number 7 into "7" first!'},
  {planet:'🌠',planetName:'Nebula Cloud',planetSub:'Wrong postcard delivered!',alien:'👽',alienName:'Nova',story:'My postcard says <b>"My pet: pet"</b> — it printed the word "pet" instead of my actual pet\'s name!',broken:'print("My pet: " + "pet")',wanted:'My pet: Stardust',choices:['print("My pet: " + pet)','print("My pet: " - pet)','print(My pet: + pet)','print("My pet: " + \'pet\')'],answer:0,message:'✅ pet is a variable — remove the quotes! "pet" is a string that always says "pet", but pet holds the real value!'},
];

const S4=[
  {planet:'🌌',planetName:'Galaxy Core',planetSub:'Number conversion lab',alien:'✨',alienName:'Sage',numVar:'age',numVal:'10',strVal:'"10"',question:'What does this print?',code:`<span class="cl-fn">print</span>(<span class="cl-str">"I am "</span> <span class="cl-op">+</span> <span class="cl-fn">str</span>(<span class="cl-var">age</span>))`,answer:'I am 10',choices:['I am age','I am 10','I am "10"','TypeError! 💥'],message:'🧪 str(age) transforms 10 → "10", then "I am " + "10" = "I am 10". No TypeError!'},
  {planet:'🛸',planetName:'Asteroid Base',planetSub:'Which code causes an error?',alien:'🎮',alienName:'Rexxi',numVar:'score',numVal:'55',strVal:'"55"',question:'Which code will cause a TypeError? 💥',code:null,answer:'print("Score: " + score)',choices:['print("Score: " + str(score))','print(str(score))','print("Score: " + score)','print(score)'],isError:true,message:'💥 You can\'t use + between text and a NUMBER directly. str(score) converts it to text first!'},
  {planet:'🌙',planetName:'Moon Station 9',planetSub:'Printing a pure number',alien:'🤖',alienName:'Blip',numVar:'lives',numVal:'3',strVal:'"3"',question:'What does this print?',code:`<span class="cl-fn">print</span>(<span class="cl-var">lives</span>)`,answer:'3',choices:['lives','"3"','3','str(3)'],message:'🎮 Just print(lives) — when printing a number alone, no str() needed! str() is only needed when JOINING with text!'},
  {planet:'🪐',planetName:'Planet Zeta',planetSub:'Adding numbers AND text',alien:'👾',alienName:'Zorp',numVar:'stars',numVal:'99',strVal:'"99"',question:'What does this code print?',code:`<span class="cl-fn">print</span>(<span class="cl-var">stars</span> <span class="cl-op">+</span> <span class="cl-str">" stars"</span>)`,answer:'TypeError! 💥',choices:['99 stars','"99" stars','TypeError! 💥','stars 99'],message:'⚠️ stars is a number! Python crashes when + tries to join a number and text. Fix: str(stars) + " stars"!'},
];

/* ── HELPERS ── */
function sync(){
  document.getElementById('elXP').textContent=xp;
  document.getElementById('elLives').textContent=lives>0?'❤️'.repeat(lives):'💀';
  document.getElementById('elStage').textContent=(stage+1)+'/'+TOTAL;
  document.getElementById('elStreak').textContent=streak;
  document.getElementById('barXP').textContent=xp+' XP';
}
let toastT;
function toast(type,msg){const t=document.getElementById('toast');t.textContent=msg;t.className=`toast ${type} show`;clearTimeout(toastT);toastT=setTimeout(()=>t.className=`toast ${type}`,2800)}
function showNext(){document.getElementById('btnNext').classList.add('show')}
function hideNext(){document.getElementById('btnNext').classList.remove('show')}
function popStars(n=5){
  const e=['⭐','✨','💥','🌟','💫','📮','🎉'];
  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='star-pop';el.textContent=e[i%e.length];
    el.style.cssText=`left:${10+Math.random()*80}vw;top:${15+Math.random()*50}vh;animation-delay:${i*.06}s;position:fixed;z-index:9999;font-size:${1.1+Math.random()*.8}rem;pointer-events:none`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),750);
  }
}
function confetti(){
  const cols=['#0cbfb5','#7c5cbf','#d4567a','#c8960a','#1a9e6a','#60a5fa'];
  for(let i=0;i<58;i++){
    const el=document.createElement('div');
    el.style.cssText=`position:fixed;width:${5+Math.random()*7}px;height:${5+Math.random()*7}px;border-radius:${Math.random()>.5?'50%':'2px'};background:${cols[Math.floor(Math.random()*cols.length)]};left:${Math.random()*100}vw;top:-12px;z-index:9999;animation:confettiFall ${1.8+Math.random()*1.4}s ease-in ${Math.random()*.9}s forwards`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),3200);
  }
}

/* ── FIX 1: shuffleArr never mutates the original array ── */
function shuffleArr(a){return [...a].sort(()=>Math.random()-.5)}

const STAGE_NAMES=['🖨️ Machine 1: The Stamp Press','🧲 Machine 2: The Message Mixer','⚡ Machine 3: The Bug Zapper','⚗️ Machine 4: The str() Transformer'];
function stageBar(){return `<div class="stage-bar"><span class="stage-name">${STAGE_NAMES[stage]}</span><div class="stage-dots">${Array.from({length:TOTAL},(_,i)=>`<div class="dot${i<stage?' done':i===stage?' active':''}"></div>`).join('')}</div></div>`}

/* ── STAGE 1 ── */
let s1i=0,s1printed=false;
function renderS1(){
  if(s1i>=S1.length){stageOver();return}
  hideNext();s1printed=false;
  const q=S1[s1i];
  document.getElementById('panel').innerHTML=`${stageBar()}
<div class="arena">
  <div class="planet-bar"><div class="planet-emoji">${q.planet}</div><div class="planet-info"><div class="planet-name">${q.planetName}</div><div class="planet-sub">${q.planetSub}</div></div></div>
  <div class="hint" style="margin-bottom:10px">📬 An alien is waiting for their postcard! <b>Press PRINT</b> to run the code, then pick the correct postcard that prints out!</div>
  <div class="code-display">${q.code.replace(/\n/g,'<br>')}</div>
  <div class="stamp-machine"><button class="print-btn" id="printBtn" onclick="pressStamp()">🖨️ PRESS PRINT!</button></div>
  <div id="choicesArea"></div>
</div>`;
  sync();
}
function pressStamp(){
  if(s1printed)return;s1printed=true;
  const btn=document.getElementById('printBtn');
  btn.disabled=true;btn.textContent='✅ Printing…';btn.style.background='rgba(12,191,181,0.15)';btn.style.color='var(--teal)';btn.style.border='1.5px solid var(--teal)';btn.style.boxShadow='none';
  setTimeout(()=>showS1Choices(),800);
}
function showS1Choices(){
  const q=S1[s1i];
  /* FIX 2: shuffleArr returns a new array — store it for answer lookup */
  const shuffled=shuffleArr(q.choices);
  window._s1Shuffled=shuffled;
  document.getElementById('choicesArea').innerHTML=`
    <div style="text-align:center;font-size:.74rem;font-weight:800;color:var(--muted);margin-bottom:9px">👆 Which postcard did the alien receive?</div>
    <div class="pc-choices">
      ${shuffled.map((c,i)=>`<div class="pc-choice" id="pcc${i}" onclick="ansS1(${i})" style="animation-delay:${i*.06}s"><div class="pcc-inner"><div class="pcc-stamp">📮</div><div class="pcc-text">${c}</div><div class="pcc-lines"></div></div></div>`).join('')}
    </div>`;
}
function ansS1(idx){
  const q=S1[s1i];
  const shuffled=window._s1Shuffled;
  const val=shuffled[idx];
  const cards=[...document.querySelectorAll('.pc-choice')];
  cards.forEach(c=>c.classList.add('off'));
  if(val===q.answer){
    cards[idx].classList.remove('off');cards[idx].classList.add('ok');
    xp+=18;streak++;hits++;popStars(5);toast('ok','📮 Delivered! +18 XP  🎉');
    setTimeout(()=>{s1i++;renderS1()},900);
  } else {
    cards[idx].classList.remove('off');cards[idx].classList.add('bad');
    const ri=shuffled.indexOf(q.answer);
    if(ri>=0){cards[ri].classList.remove('off');cards[ri].classList.add('reveal');}
    lives=Math.max(0,lives-1);streak=0;
    toast('bad',`❌ Not that one! The output was: ${q.answer}`);
    setTimeout(()=>{s1i++;renderS1()},1200);
  }
  sync();
}

/* ── STAGE 2 ── */
let s2i=0,bowl=[],s2ShuffledIngredients=[];
function renderS2(){
  if(s2i>=S2.length){stageOver();return}
  hideNext();bowl=[];
  const q=S2[s2i];
  /* FIX 3: shuffle once, store with original indices so used state works correctly */
  s2ShuffledIngredients=shuffleArr(q.ingredients.map((ing,origIdx)=>({...ing,origIdx})));
  document.getElementById('panel').innerHTML=`${stageBar()}
<div class="arena">
  <div class="planet-bar"><div class="planet-emoji">${q.planet}</div><div class="planet-info"><div class="planet-name">${q.planetName}</div><div class="planet-sub">${q.planetSub}</div></div></div>
  <div class="mixer-scene">
    <div class="customer-order"><div class="order-label">📬 This alien wants a postcard saying:</div><div class="order-text">${q.targetOutput}</div></div>
    <div class="code-display" style="margin-bottom:10px">${q.varDisplay}</div>
    <div class="hint">💡 <b>Tap ingredients</b> in order to build the print() code. Tap a chip to remove it!</div>
    <div class="mixer-bowl" id="mixBowl"><span class="bowl-placeholder">tap ingredients below to mix…</span></div>
    <div class="ingredient-shelf" id="shelfArea">${s2ShuffledIngredients.map((ing,si)=>`<div class="ingredient ${ing.type}-type" id="ing${si}" onclick="addIng(${si})">${ing.label}</div>`).join('')}</div>
    <div class="blender-anim" id="blenderAnim"><span class="blender-jar">🪄</span><span class="blending-text">Mixing your message…</span></div>
    <button class="blend-btn" id="blendBtn" onclick="checkS2()" disabled>🎨 BLEND & PRINT!</button>
  </div>
</div>`;
  sync();window._s2Q=q;
}
function addIng(si){
  const el=document.getElementById('ing'+si);
  if(!el||el.classList.contains('used'))return;
  const ing=s2ShuffledIngredients[si];
  el.classList.add('used');
  bowl.push({label:ing.label,type:ing.type,si});
  renderBowl();
  document.getElementById('blendBtn').disabled=bowl.length<3;
}
function removeFromBowl(pos){
  const rem=bowl.splice(pos,1)[0];
  const el=document.getElementById('ing'+rem.si);
  if(el)el.classList.remove('used');
  renderBowl();
  document.getElementById('blendBtn').disabled=bowl.length<3;
}
function renderBowl(){
  const b=document.getElementById('mixBowl');
  if(bowl.length===0){b.innerHTML='<span class="bowl-placeholder">tap ingredients below to mix…</span>';b.classList.remove('ready');return}
  b.classList.add('ready');
  b.innerHTML=bowl.map((c,pi)=>`<span class="mix-chip ${c.type}" onclick="removeFromBowl(${pi})">${c.label}<span class="rm">✕</span></span>`).join('');
}
function checkS2(){
  const q=window._s2Q;
  const built=bowl.map(c=>c.label).join('');
  const correct=q.correctOrder.join('');
  if(built===correct){
    document.getElementById('blenderAnim').classList.add('show');
    document.getElementById('blendBtn').disabled=true;
    setTimeout(()=>{
      document.getElementById('blenderAnim').classList.remove('show');
      xp+=24;streak++;hits++;popStars(7);
      toast('ok',`📮 Printed: "${q.targetOutput}"  +24 XP 🎉`);
      setTimeout(()=>{s2i++;renderS2()},1100);
    },900);
  } else {
    /* FIX 4: on wrong answer just shake the bowl — don't auto-remove pieces */
    const bowlEl=document.getElementById('mixBowl');
    bowlEl.classList.add('error-shake');
    setTimeout(()=>bowlEl.classList.remove('error-shake'),500);
    lives=Math.max(0,lives-1);streak=0;
    toast('bad','❌ Wrong mix! Check the order — tap ✕ to remove pieces and try again!');
  }
  sync();
}

/* ── STAGE 3 ── */
let s3i=0;
function renderS3(){
  if(s3i>=S3.length){stageOver();return}
  hideNext();
  const q=S3[s3i];
  /* FIX 5: build shuffled list ONCE and store it — both render and answer handler use the same array */
  const shuffled=shuffleArr(q.choices.map((c,oi)=>({c,oi})));
  window._s3Shuffled=shuffled;
  document.getElementById('panel').innerHTML=`${stageBar()}
<div class="arena" style="position:relative">
  <div class="planet-bar"><div class="planet-emoji">${q.planet}</div><div class="planet-info"><div class="planet-name">${q.planetName} — <span style="color:var(--red)">⚠️ Error</span></div><div class="planet-sub">${q.planetSub}</div></div></div>
  <div class="zap-scene">
    <div class="broken-terminal">
      <div class="broken-code">${q.broken}</div>
      <div class="error-msg">⚠ SyntaxError / TypeError — postcard failed to print</div>
      <div class="zap-overlay" id="zapOverlay">⚡</div>
    </div>
    <div class="alien-bubble"><span class="bubble-alien">${q.alien}</span><div class="bubble-text">I'm <b>${q.alienName}</b> and I wanted: <b style="color:var(--green)">${q.wanted}</b><br>${q.story}</div></div>
    <div class="hint">⚡ <b>Zap the bug!</b> Pick the fixed code to unblock ${q.alienName}'s postcard.</div>
    <div class="fix-choices" id="fixChoices">
      ${shuffled.map(({c},si)=>`<div class="fix-opt" id="fo${si}" onclick="ansS3(${si})">${c}</div>`).join('')}
    </div>
  </div>
</div>`;
  sync();
}
function ansS3(slotIdx){
  const q=S3[s3i];
  const shuffled=window._s3Shuffled;
  const origIdx=shuffled[slotIdx].oi;
  const btns=[...document.querySelectorAll('.fix-opt')];
  btns.forEach(b=>b.classList.add('off'));
  if(origIdx===q.answer){
    btns[slotIdx].classList.remove('off');btns[slotIdx].classList.add('ok');
    const z=document.getElementById('zapOverlay');z.classList.add('show');setTimeout(()=>z&&z.classList.remove('show'),600);
    xp+=20;streak++;hits++;popStars(5);toast('ok','⚡ Bug zapped! +20 XP  🛠️');
    setTimeout(()=>{s3i++;renderS3()},950);
  } else {
    btns[slotIdx].classList.remove('off');btns[slotIdx].classList.add('bad');
    /* reveal the correct slot */
    shuffled.forEach(({oi},si)=>{if(oi===q.answer){btns[si].classList.remove('off');btns[si].classList.add('reveal');}});
    lives=Math.max(0,lives-1);streak=0;
    toast('bad',`❌ Still buggy! The fix was: ${q.choices[q.answer]}`);
    setTimeout(()=>{s3i++;renderS3()},1300);
  }
  sync();
}

/* ── STAGE 4 ── */
let s4i=0;
function renderS4(){
  if(s4i>=S4.length){stageOver();return}
  hideNext();
  const q=S4[s4i];
  /* FIX 6: shuffle once, store it — answer lookup uses the stored shuffled array */
  const shuffled=shuffleArr(q.choices.map((c,oi)=>({c,oi})));
  window._s4Shuffled=shuffled;
  document.getElementById('panel').innerHTML=`${stageBar()}
<div class="arena">
  <div class="planet-bar"><div class="planet-emoji">${q.planet}</div><div class="planet-info"><div class="planet-name">${q.planetName}</div><div class="planet-sub">${q.planetSub}</div></div></div>
  <div class="transformer-scene">
    <div class="type-explainer">
      <div class="type-block"><div class="type-box num"><div class="type-box-label">NUMBER</div><div class="type-box-val">${q.numVal}</div></div><div class="type-label">${q.numVar} = ${q.numVal}</div></div>
      <div class="wall"><div class="wall-label">CAN'T MIX</div><div class="wall-bar"></div></div>
      <div class="type-block"><div class="str-machine" id="strMachine" onclick="fireStr()" title="Click str() to convert!"><div class="str-machine-emoji">🔄</div><div class="str-machine-label">str()</div></div><div class="type-label">converter<br>click me!</div></div>
      <div class="type-arrow">→</div>
      <div class="type-block"><div class="type-box txt"><div class="type-box-label">TEXT</div><div class="type-box-val">${q.strVal}</div></div><div class="type-label">str(${q.numVar}) = ${q.strVal}</div></div>
    </div>
    <div class="str-question"><b>${q.question}</b>${q.code?`<span class="str-code">${q.code}</span>`:''}</div>
    <div class="hint">⚗️ <b>Remember:</b> str() converts a number into text so it can be joined with + to other text.</div>
    <div class="str-choices" id="strChoices">
      ${shuffled.map(({c},si)=>`<div class="str-opt" id="so${si}" onclick="ansS4(${si})">${c}</div>`).join('')}
    </div>
  </div>
</div>`;
  sync();
}
function fireStr(){const m=document.getElementById('strMachine');m.classList.add('fired');setTimeout(()=>m&&m.classList.remove('fired'),400);popStars(2)}
function ansS4(si){
  const q=S4[s4i];
  const shuffled=window._s4Shuffled;
  const val=shuffled[si].c;
  const btns=[...document.querySelectorAll('.str-opt')];
  btns.forEach(b=>b.classList.add('off'));
  if(val===q.answer){
    btns[si].classList.remove('off');btns[si].classList.add('ok');
    xp+=22;streak++;hits++;popStars(6);toast('ok',`⚗️ Correct! +22 XP`);
    setTimeout(()=>{s4i++;renderS4()},1000);
  } else {
    btns[si].classList.remove('off');btns[si].classList.add('bad');
    /* FIX 7: find correct slot via stored shuffled array, not textContent comparison */
    shuffled.forEach(({c},i)=>{if(c===q.answer){btns[i].classList.remove('off');btns[i].classList.add('reveal');}});
    lives=Math.max(0,lives-1);streak=0;
    toast('bad',`❌ Not quite! The answer is: ${q.answer}`);
    setTimeout(()=>{s4i++;renderS4()},1300);
  }
  sync();
}

/* ── FLOW ── */
function stageOver(){showNext()}
function advance(){hideNext();stage++;if(stage>=TOTAL){showResult();return}render()}
function render(){document.getElementById('result').classList.remove('show');if(stage===0)renderS1();else if(stage===1)renderS2();else if(stage===2)renderS3();else renderS4()}
function showResult(){
  document.getElementById('panel').innerHTML='';hideNext();
  const el=document.getElementById('result');el.classList.add('show');
  const tier=xp>=310?0:xp>=180?1:2;
  const data=[{t:'🏆',ti:'Galactic Post Master! 🎉',s:'Every alien got their perfect postcard! You know print() inside out! 🤖'},{t:'🥈',ti:'Cosmic Courier! 🌟',s:'Great work! The alien post office is proud of you!'},{t:'🥉',ti:'Post Office Recruit! 💪',s:'Good effort! Review the machines and try again to improve!'}][tier];
  document.getElementById('rTrophy').textContent=data.t;document.getElementById('rTitle').textContent=data.ti;document.getElementById('rSub').textContent=data.s;
  document.getElementById('rXP').textContent=xp;document.getElementById('rRight').textContent=hits;document.getElementById('rStars').textContent=xp>=310?'⭐⭐⭐':xp>=180?'⭐⭐':'⭐';
  if(xp>=180)confetti();
  localStorage.setItem('p2_lesson06GameScore',xp);const prev=parseInt(localStorage.getItem('part2_progress'))||1;if(prev<7)localStorage.setItem('part2_progress','7');
}
function restart(){
  xp=0;lives=3;streak=0;hits=0;stage=0;s1i=0;s2i=0;s3i=0;s4i=0;bowl=[];s2ShuffledIngredients=[];
  document.getElementById('result').classList.remove('show');render();
}
render();
</script>
</body>
</html>
