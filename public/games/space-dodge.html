<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Dodge</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #020617; color: #e2e8f0; }
      canvas { display: block; margin: 0 auto; background: #0f172a; border: 2px solid #334155; }
      .hud { text-align: center; padding: 12px; }
      button { background: #22c55e; border: 0; padding: 8px 14px; border-radius: 999px; color: white; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="hud">
      <strong>Space Dodge</strong> - Move with Arrow Keys and avoid asteroids.
      <div id="score">Score: 0</div>
      <button id="restart">Restart</button>
    </div>
    <canvas id="game" width="640" height="360"></canvas>
    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const restartBtn = document.getElementById("restart");

      let score = 0;
      let over = false;
      const player = { x: 100, y: 180, w: 28, h: 28, speed: 4 };
      let rocks = [];
      const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

      function spawnRock() {
        rocks.push({ x: 660, y: Math.random() * 330, w: 26, h: 26, speed: 2 + Math.random() * 3 });
      }

      function resetGame() {
        score = 0;
        over = false;
        rocks = [];
        player.x = 100;
        player.y = 180;
      }

      function hit(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function update() {
        if (over) return;
        if (keys.ArrowUp) player.y -= player.speed;
        if (keys.ArrowDown) player.y += player.speed;
        if (keys.ArrowLeft) player.x -= player.speed;
        if (keys.ArrowRight) player.x += player.speed;

        player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
        player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));

        if (Math.random() < 0.03) spawnRock();

        rocks.forEach((rock) => {
          rock.x -= rock.speed;
          if (hit(player, rock)) over = true;
        });
        rocks = rocks.filter((rock) => rock.x + rock.w > 0);

        score += 1;
        scoreEl.textContent = `Score: ${score}`;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(player.x, player.y, player.w, player.h);

        ctx.fillStyle = "#f97316";
        rocks.forEach((rock) => ctx.fillRect(rock.x, rock.y, rock.w, rock.h));

        if (over) {
          ctx.fillStyle = "rgba(2,6,23,.8)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#f8fafc";
          ctx.font = "bold 28px Arial";
          ctx.fillText("Game Over", 250, 170);
        }
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      window.addEventListener("keydown", (e) => { if (e.key in keys) keys[e.key] = true; });
      window.addEventListener("keyup", (e) => { if (e.key in keys) keys[e.key] = false; });
      restartBtn.addEventListener("click", resetGame);
      loop();
    </script>
  </body>
</html>
